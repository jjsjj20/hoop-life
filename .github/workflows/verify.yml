name: verify

# 玩法代码是单文件成品，靠人工回归已经不可靠。
# 每次 push / PR 先重建并比对成品，再自动发现全部 test_*.js 和 AST 静态审查。
# 想确认这道闸门真的有效：随手改坏一处（比如删掉 GATED 里一条），CI 必须变红。

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 从原版重建并比对成品
        run: python tools/build_all.py --skip-optimize
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: 检查构建与发布契约
        run: python tools/test_build_contract.py
      - name: 安装测试依赖
        run: npm ci --no-audit --no-fund
      - name: 跑全部验证
        run: node tools/verify_all.js
