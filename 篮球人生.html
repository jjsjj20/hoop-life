};
/* ═══════════ 07.4 伤病时间化（状态而不是赛季末一掷） ═══════════
 * 旧版：赛季末掷一次骰子 → 弹一个事件 → 结束，伤病对赛程没有任何影响。
 * 现在：S.injury={part,sev,out,until,rein} —— 部位/严重度/剩余场次是真实状态：
 *   · 伤停期间球队照打（焦点战直接跳过、战绩按缺阵场次打折、队友顶上）；
 *   · 强行复出会留下复发风险（下一次同部位受伤更重），带伤出战则本季技能打折；
 *   · 老伤部位累积（S.injSites）：同一个部位反复受伤 → 该部位再伤概率与 35 岁下滑都更狠；
 *   · 与 28 岁身体信号（evBody 会点出老伤部位）、35 岁下滑联动。 */
const INJ_PARTS={脚踝:.26,膝盖:.20,腿筋:.16,腹股沟:.12,手腕:.10,背部:.09,肩膀:.07};
const INJ_SEV={1:{n:'轻度',g:[2,5],sk:0},2:{n:'中度',g:[8,18],sk:-2},3:{n:'重度',g:[25,45],sk:-5}};
const INJ_RETURN={1:'一两周',2:'四到六周',3:'两三个月'};
function injSites(){S.injSites=S.injSites||{};return S.injSites;}
function injSiteTotal(){const t=injSites();return Object.keys(t).reduce((s,k)=>s+(t[k]||0),0);}
function injTopSite(){
  const t=injSites(),ks=Object.keys(t);
  if(!ks.length)return null;
  return ks.reduce((a,b)=>(t[b]||0)>(t[a]||0)?b:a,ks[0]);
}
/* 老伤越多，再伤的概率越高（这是"累积"唯一该有的效果：不是伤病列表，是风险） */
function injRiskFromSites(){return clamp(injSiteTotal()*.012,0,.09);}
function injProbNow(){
  return clamp(injProb()+injRiskFromSites()+(S.injury&&S.injury.rein?.10:0),0,.75);
}
/* 本季已经打了多少场（按四季进度把联赛场次摊开），伤停倒计时用它当钟 */
/* 本赛季场次：唯一出处（赛季战绩、伤病时钟、生涯累计都读它）
 * 职业按联赛取，青训 14 场（与 CAREER_GAMES['青训'] 一致），NCAA 30 场 */
function gamesInSeason(){
  if(S.league==='青训')return 14;
  return isPro()?seasonGames(myLeagueKey()||'nba'):30;
}
function seasonGamesElapsed(){
  const total=gamesInSeason(),stages=['spring','summer','autumn','winter'];
  if(S.stage==='playoffs')return total;
  const i=Math.max(0,stages.indexOf(S.stage));
  const frac=clamp((S.stageDone||0)/Math.max(1,S.stageNeed||1),0,1);
  return clamp(Math.round(total/4*(i+frac)),0,total);
}
function injOut(){return S.injury?Math.max(0,(S.injury.until||0)-seasonGamesElapsed()):0;}
/* 掷一次伤病：部位按权重（老伤部位加权）、严重度按本节分布 */
function rollInjury(force){
  if(S.injury)return null;
  if(!force&&!R.chance(injProbNow()))return null;
  const t=injSites(),parts=Object.keys(INJ_PARTS);
  const w=parts.map(k=>(INJ_PARTS[k])*(1+(t[k]||0)*.55));
  const sum=w.reduce((a,b)=>a+b,0);
  let r=R.float(0,sum),part=parts[0];
  for(let i=0;i<parts.length;i++){r-=w[i];if(r<=0){part=parts[i];break;}}
  const roll=R.float(0,1);
  const sev=roll<.06?3:(roll<.36?2:1);
  return {part:part,sev:sev};
}
function injStart(inj,outGames){
  const sev=inj.sev||1;
  const g=outGames!=null?outGames:R.int(INJ_SEV[sev].g[0],INJ_SEV[sev].g[1]);
  const from=seasonGamesElapsed();
  const base=injSettleMissed();            /* 上一段伤停结清进基数，别让它跟着新伤一起被重算 */
  S.injury={part:inj.part,sev:sev,out:g,until:from+g,from:from,len:g,rein:inj.rein||0,y:seasonLabel()};
  S.injuryMissedBase=base;
  S.injuryMissed=base;
  const t=injSites();t[inj.part]=(t[inj.part]||0)+1;
  S.log.push({y:seasonLabel(),t:'受伤：'+inj.part+'（'+INJ_SEV[sev].n+'，预计缺阵 '+g+' 场）'});
  return S.injury;
}
/* 本季缺阵场次：只看「这一次伤停从受伤那一刻走到现在」走了多少场，最多算到预计复出场次。
 * 旧写法靠 _lastGame 累加差值，而每次 injStart 都会造一个新对象（_lastGame 归零）→
 * 新伤一上来就把本赛季已打的场次全部记成缺阵（实测 2028-29 记成"缺阵 50/52 场、出场 2 场"），
 * 连带污染出场数、命中率、球队战绩与生涯总量。 */
function injSettleMissed(){
  const base=S.injuryMissedBase||0;
  if(!S.injury)return base;
  const now=seasonGamesElapsed();
  const len=(S.injury.len!=null)?S.injury.len:injOut();
  return base+clamp(now-(S.injury.from||0),0,Math.max(0,len));
}
/* 伤停时钟：每次事件/比赛之后调用。康复了就把状态清掉（并记一条大事记） */
function injTick(){
  if(!S.injury)return null;
  const out=injOut();
  S.injury.out=out;
  S.injuryMissed=injSettleMissed();
  if(out<=0){
    const p=S.injury.part,sev=S.injury.sev;
    S.injuryMissedBase=S.injuryMissed;   /* 这段伤停结清 */
    S.injury=null;
    S.log.push({y:seasonLabel(),t:'伤愈复出（'+p+' · '+INJ_SEV[sev].n+'）'});
    return 'healed';
  }
  return null;
}
function injText(){
  if(!S.injury)return '';
  const i=S.injury,out=injOut();
  return i.part+'（'+INJ_SEV[i.sev].n+'）· 还缺 '+out+' 场'+(i.rein?(' · 带复发风险'):'');
}
/* 受伤事件：轻/中/重度各有处置，重度沿用「手术 or 退役」的分量 */
function evInjury(inj){
  const sev=inj.sev,part=inj.part,nm=INJ_SEV[sev].n;
  if(sev>=3){
    const opOk=R.chance(injSites()[part]>1?.45:.6),conOk=R.chance(.35);
    return {id:'inj_sev',title:'重伤 · '+part,special:true,injData:{part:part,sev:3},
      scene:`一次落地，${S.name}听到 ${part} 传来的闷响。担架进场，全场寂静。\n\n核磁结果：${part} ${R.pick(['前十字韧带断裂','跟腱撕裂','半月板严重损伤','应力性骨折'])}。医生的语气很平静，平静得让人害怕。`,
      choices:[
        {t:'立即退役，保住身体',fx:{end:'retire'},o:'他平静地接受了这个结果。身体是自己的，人生还长。'},
        {t:'接受手术，赌上一切复出',fx:opOk?{durability:-15}:{durability:-15,end:'retire'},
          o:opOk?'手术成功。一年零三个月后，他重新站上球场。':'手术成功了，但漫长的康复后，身体再也无法承受职业强度。',
          injAct:'surgery'},
        {t:'保守治疗，赛季报销',fx:{durability:-10},o:'这个赛季结束了。他把康复计划贴在冰箱门上。',injAct:'out'}]};
  }
  return {id:'inj_'+part,title:'伤病 · '+part+'（'+nm+'）',special:true,injData:{part:part,sev:sev},
    scene:`比赛第二节，${S.name}在一次${R.pick(['变向','落地','对抗','急停'])}中感到 ${part} 一紧，随后是熟悉的刺痛。\n\n队医把他扶到场边，简单检查后摇头：${part}${sev===2?'拉伤，至少四到六周':'轻微不适，一到两周'}。更衣室里的空气沉了下来——球队接下来这一段时间，要在他缺阵的情况下打球。`,
    choices:[
      {t:'按计划康复，等完全好再上',fx:{durability:1},o:'他决定不和时间赌。康复计划贴在柜门上，一天一天划掉。',injAct:'rest'},
      {t:'打封闭，争取早点回来',fx:{clutch:2,durability:-3,form:-10},o:'两针封闭下去，疼痛被压住了，但队医的脸色很难看。',injAct:'rush'},
      {t:'带伤出战，边打边养',fx:{stability:1,durability:-2},o:'他选择留在场上，代价是每一次起跳都要咬牙。',injAct:'play'}]};
}
/* 伤停中的抉择：继续养 or 提前复出（复出会留下复发风险） */
function evInjuryReturn(){
  if(!S.injury)return null;
  const i=S.injury,out=injOut();
  if(out<=1)return null;
  return {id:'inj_ret',title:'伤病 · 复出抉择',special:true,

      {t:'复出但控制出场时间',fx:{stability:1},o:'他打了，但每场只上二十分钟。',injAct:'limit'}]};
}
function injHTML(){
  const rows=[];
  if(S.injury)rows.push(`<div class="row"><span>当前伤病</span><b style="color:var(--down)">${esc(injText())}</b></div>`);

/* 特定（脚本/里程碑）事件规则表：[无副作用条件, 执行(设标记并返回事件)]
 * getEvent 与 pendingSpecial 共用此表，保证"实际触发"与"探测"永远一致 */

const SPECIAL_RULES=[

/* 本季是否还有待触发的特定事件（无副作用探测，供快速模式“突破配额”判断）
 * 焦点战也算：否则阶段会因为「配额已满」提前结束，把排好的比赛吞掉 */
function pendingSpecial(){return SPECIAL_RULES.some(r=>r[0]())||!!focusNextSlot();}
/* 事件调度：特定事件优先 → 赛程里的焦点战 → 季节事件池 */
function getEvent(){
  if(S.stage==='playoffs')return safeEvent(); /* 季后赛阶段不走常规事件池 */
  const r=SPECIAL_RULES.find(rule=>rule[0]());
  if(r){const ev=r[1]();if(ev){ev.special=true;return ev;}return pickGeneric();}
  const slot=focusNextSlot();
  if(slot){focusMarkPlayed(slot);return evFocusGame(slot);}
  return pickGeneric();
}
/* 每季事件配额：
 *   沉浸模式 —— 15岁首季 1 件，其余每季 2~4 件（原有节奏）
 *   快速模式 —— 每季 1~2 件随机事件；特定(剧情/里程碑)事件不计入配额、
 *              但每季总事件数（特定+随机）最多 4 件 */
function stageNeedFor(){
  if(S.mode==='fast')return R.int(1,2);
  return (S.age===15)?1:R.int(2,4);
}

 * ③新秀合同金额随顺位浮动（首轮 4 年 / 次轮 3 年）；④球队可给出选秀承诺；
 * ⑤落选判定与行情挂钩；⑥选秀班底 60 人（两轮）——签位抽签与选秀大会为独立页面，新秀真实入队（v4.26.0）。 */
function draftRangeText(v){
  v=(v==null&&S.draft)?S.draft.stock:v;
  if(v==null)v=40;
  v=Math.round(v);
  const zone=v<=3?'状元热门':v<=8?'乐透前段':v<=14?'乐透区':v<=20?'首轮中段':v<=30?'首轮末段':v<=40?'次轮前段':v<=52?'次轮中段':v<=60?'次轮末段':'落选边缘';
  const lo=clamp(v-6,1,60),hi=clamp(v+8,1,70);
  return zone+' · '+(hi>=62?(lo+'-60+（可能落选）'):('约 '+lo+'-'+hi+' 位'));
}
function draftStockInit(){
  /* v4.30.0：行情与班底同尺——班底曲线 o(pick)=84-(pick-1)×0.35（2K 对标）的逆函数：
   * 期望顺位 ≈ 1+(84-o)/0.4。锚点：84=状元、80=乐透末、76=首轮中段、72=首轮末、68=次轮前段、
   * 66=次轮中后段、63 以下基本落选（旧版 68 就能当状元热门——进入难度大幅收紧）。
   * 试训涨跌/球队承诺/选秀夜噪音/顺位保护照旧。 */
  const o=ovr(),age=S.age;
  /* 分段逆函数（与班底分段一致）：o>65.3（乐透级区）→ 顺位=87-o（86=状元、76=11）；
   * o≤65.3 → 普通班底曲线的逆函数 12+(65.3-o)/0.55。
   * 对比旧版：75 分从「状元」变首轮中段、68 分从状元热门变首轮中后段——进入难度收紧。 */
  let base=o>65.3?Math.max(1,87-o):(12+(65.3-o)/0.55);
  base+=age>=23?4:age>=22?3:age>=21?1:0;
  if(age<=19)base-=1;
  return clamp(Math.round(base),1,72);
}
/* ---- v4.9.3 真实签位：战绩倒序 + 加权乐透 ----
 * 签位只认「上赛季常规赛战绩」，不认球队底子强不强——底子好但上赛季伤兵满营打崩了，
 * 就该拿到高顺位。乐透区按现实规则加权抽签，而不是等概率乱序。 */
const NBA_LOTTO_ODDS=[14.0,14.0,14.0,12.5,10.5,9.0,7.5,6.0,4.5,3.0,2.0,1.5,1.0,0.5];
const CBA_LOTTO_ODDS=[22,19,17,14,11,8,6,3];
const LOTTO_RULES={
  nba:{teams:'nba',nLot:14,nDraw:4,odds:NBA_LOTTO_ODDS,slot:['状元签','榜眼签','探花签','第四顺位']},
  cba:{teams:'cba',nLot:8,nDraw:3,odds:CBA_LOTTO_ODDS,slot:['状元签','榜眼签','探花签']}
};
/* 上赛季常规赛战绩，战绩最差的排最前。
 * 同战绩用随机数拆开先后（现实里是抛硬币决定选秀顺序）。 */
function standingsWorstFirst(lg){
  let rows=null;
  try{rows=computeStandings(lg);}catch(e){rows=null;}
  if(!rows||!rows.length){
    /* 兜底：拿不到战绩就退回按球队实力排，绝不因此崩掉选秀 */
    return (TEAMS[lg]||[]).map(t=>({team:t[0],str:t[1],wins:0}))
      .sort((a,b)=>a.str-b.str);
  }
  /* v4.15.1：并列战绩的 tiebreak 改为「实力弱者先选」——原先每次调用重掷随机数，
   * 同一赛季的并列顺序在排名面板/选秀之间漂移（同胜场队跨赔率档位时，
   * 选秀期望也会随之偶然化）。确定性排序后，同赛季顺序稳定。 */
  return rows.map(r=>({team:r.team,str:r.str,wins:r.wins||0}))
    .sort((x,y)=>x.wins-y.wins||x.str-y.str);
}
/* 按概率逐签无放回抽样 —— 等价于现场「抽中不放回、抽到重复队就重抽」的小球抽签 */
function lotteryDraw(order,odds,n){
  const pool=order.map((t,i)=>({team:t,w:Math.max(0,Number(odds[i])||0)}));
  const win=[];
  for(let k=0;k<n&&pool.length;k++){
    let tot=0;for(let i=0;i<pool.length;i++)tot+=pool[i].w;
    if(tot<=0)break;
    let r=R.float(0,tot),hit=pool.length-1;
    for(let i=0;i<pool.length;i++){r-=pool[i].w;if(r<=0){hit=i;break;}}
    win.push(pool[hit].team);
    pool.splice(hit,1);
  }
  return {win,left:pool.map(x=>x.team)};
}
/* 生成一届完整签位表：乐透抽中的前 N 签 + 剩余乐透队（战绩倒序）+ 季后赛队（战绩倒序） */
function draftOrderOf(lg){
  const cfg=LOTTO_RULES[lg]||LOTTO_RULES.nba;
  const st=standingsWorstFirst(cfg.teams);
  const lotto=st.slice(0,cfg.nLot),rest=st.slice(cfg.nLot);
  const lottoTeams=lotto.map(x=>x.team);
  const oddsOf={};lottoTeams.forEach((t,i)=>{oddsOf[t]=cfg.odds[i]||0;});
  const r=lotteryDraw(lottoTeams,cfg.odds,cfg.nDraw);
  return {
    lg:lg,order:r.win.concat(r.left).concat(rest.map(x=>x.team)),
    /* draw 只用于展示：抽中的顺位 + 该队抽签前的状元签概率 */
    draw:r.win.map(t=>({team:t,p:oddsOf[t]||0})),
    lotto:lottoTeams,
    slot:cfg.slot,
    playoff:rest.map(x=>x.team)
  };
}
/* 一届选秀的唯一构造点。
 * 之前 evDraftDeclare() 和 ensureDraft() 各写各的对象字面量，结果申报那条路漏了
 * draw / lotto / slot，抽签播报永远出不来——而且不报错，只是内容悄悄少了。
 * 现在只留这一个工厂，加字段不可能只补一半。 */
function newDraft(){
  const plan=draftPlanFor(curDraftYear());   /* v4.27.0：与联盟选秀共用同一份年度签位表 */
  return {stock:draftStockInit(),order:plan.order,draw:plan.draw,lotto:plan.lotto,slot:plan.slot,
          promise:null,pick:null,y:seasonLabel()};
}
/* 抽签结果文案（选秀夜 / 落选后回 CBA 时都会用到） */
function lottoText(draw,slot){
  if(!draw||!draw.length)return '';
  const nm=slot||['状元签','榜眼签','探花签','第四顺位'];
  return '本届乐透抽签：'+draw.map((x,i)=>(nm[i]||('第'+(i+1)+'签'))+' '+x.team+'（'+
    (Math.round(Number(x.p)*10)/10).toString().replace(/\.0$/,'')+'%）').join(' · ');
}
function ensureDraft(){
  if(!S.draft)S.draft={stock:null,order:null,draw:null,lotto:null,slot:null,promise:null,pick:null,y:null};
  /* 签位按赛季重抽：旧实现一旦生成就永久复用，换一年还是同一张签位表。
   * 另外把 !S.draft.draw 也算进"不完整"——老存档 / 半途造出来的 draft 缺抽签数据时能自愈。 */
  if(!S.draft.order||S.draft.order.length!==TEAMS.nba.length||S.draft.y!==seasonLabel()||!S.draft.draw){
    const plan=draftPlanFor(curDraftYear());   /* v4.27.0：与联盟选秀共用同一份年度签位表 */
    S.draft.order=plan.order;S.draft.draw=plan.draw;S.draft.lotto=plan.lotto;S.draft.slot=plan.slot;S.draft.y=seasonLabel();
  }
  if(typeof S.draft.stock!=='number'||!Number.isFinite(S.draft.stock))S.draft.stock=draftStockInit();
  return S.draft;
}
function rookieWageMult(pick){if(pick<=2)return 1.6;if(pick<=5)return 1.35;if(pick<=10)return 1.15;if(pick<=16)return 1;if(pick<=24)return .85;if(pick<=30)return .72;if(pick<=40)return .5;return .4;}
function teamAtPick(order,pick){return order[(clamp(pick,1,order.length*2)-1)%order.length];}
/* ═══════════ 06.7 NBA 选秀与签位抽签（v4.26.0 · 两个独立页面） ═══════════
 * 流程：赛季落幕 →【签位抽签】14 支乐透队按常规赛战绩拿不同概率抽 1-4 签
 *   →【选秀大会】60 个顺位逐签落定，选中的新秀写入球队名单 → 新赛季开启。
 * 数据关联：一届只有一份签位表（draftPlanFor 按年缓存）——抽签页、选秀页、
 * 选秀夜公告读同一份；页面展示的战绩与抽签用的是同一张战绩表。 */
function draftProspect(pick){
  /* v4.30.0：班底能力对标现实 2K 值（用户点名：25 年状元弗拉格 82、23 年状元文班 84）
   * —— 状元 84±3、乐透末 ~79、首轮末 ~73、60 号 ~60（次轮为发展联盟级，压联盟膨胀）（旧版状元仅 71、60 号 39）。
   * pot 改「即战力模型」：能力强、成长空间小（room 2~9 / 1~5），班底能力均值 73.7
   * ≈ 现状联盟均值 74 —— 长期均衡不变，15 年演化探针验收。
   * 「留队价值的选择偏差」结论沿用（v4.27.1 对照实验）。 */
  const pk=clamp(pick||30,1,60);
  /* 现象级头部：每届前 11 顺位为乐透级新秀（86~75，对标 2K 文班 84/弗拉格 82）——其余沿用旧曲线。
   * 全员即战力会让衰退老将被立即顶替、联盟 15 年漂移 +6.5（探针实测）——头部特例化后
   * 混合 pot 均值 67.2，膨胀回到基线内（探针验收 ≤+1.5）。 */
  const o=pk<=11?clamp(Math.round(87-pk+R.float(-2,2)),74,88)
        :clamp(Math.round(40+(58-pk)*0.55+R.float(-5,5)),38,84);
  const a=R.int(19,22);
  const room=pk<=11?R.int(4,10):((a<=20)?R.int(2,9):R.int(1,5));
  /* 名字构成（v4.26.1）：NBA 选秀班底以欧美球员为主，中国面孔约 4%——
   * 每届 60 人里 1~3 位中国新秀，偶尔出现，符合现实观感。 */
  return {n:R.chance(.96)?genWest():genCN(),p:R.pick(Object.keys(POS)),o:o,a:a,
    pot:clamp(o+room,o,97),role:'bench',rk:1,pend:1};
}
function draftPlanFor(y){
  S.draftPlans=S.draftPlans||{};
  const key=String(y);
  let p=S.draftPlans[key];
  if(!p||!p.order||p.order.length!==TEAMS.nba.length||!p.draw){
    const m=draftOrderOf('nba');   /* 战绩倒序 + 加权乐透（用当下缓存里的那张战绩表） */
    p={y:key,order:m.order,draw:m.draw,lotto:m.lotto,slot:m.slot,recs:{},resolved:false,picks:null};
    try{computeStandings('nba').forEach(r=>{p.recs[r.team]={w:r.wins,l:r.losses,str:r.str};});}catch(e){}
    S.draftPlans[key]=p;
    Object.keys(S.draftPlans).map(Number).sort((a,b)=>b-a).slice(3).forEach(k=>{delete S.draftPlans[k];});
  }
  return p;
}
/* 选中即入队：新秀写入对应球队名单（需求第 5 条） */
function draftSignRookie(team,pr){
  ensureWorld();
  S.world.nba=S.world.nba||[];
  S.world.nba.push({n:pr.n,p:pr.p,o:pr.o,a:pr.a,pot:pr.pot,t:team,
    ts:((TEAMS.nba.find(x=>x[0]===team)||[,'6'])[1]),role:'bench',rk:1,pend:1});
}
/* 逐签解析一届选秀：60 顺位（两轮）全部落位——含交易签与保护回退；
 * 班底按顺位生成（v4.27.1：状元签期望最高、二轮尾是落选级，不再整体排序）；
 * 玩家参选时把玩家插在第 myPick 位，其余顺位由班底补齐。 */
function resolveDraftInto(order,myPick,me){
  const y=curDraftYear();
  ensurePickBoard();
  const own1=draftOwnership('nba',order,y);
  const picks=[];
  for(let i=1;i<=60;i++){
    const slotTeam=teamAtPick(order,i);
    const r1=i<=30;
    const so=r1?own1[i-1]:null;
    const team=so?so.team:slotOwnedBy('nba',y,slotTeam,2);
    if(me&&myPick===i){
      picks.push({pick:i,team:team,orig:slotTeam,owner:team,reverted:!!(so&&so.reverted),
        n:me.name,p:me.pos,o:me.ovr,a:me.age,me:true});
    }else{
      const pr=draftProspect(i);
      draftSignRookie(team,pr);
      picks.push({pick:i,team:team,orig:slotTeam,owner:team,reverted:!!(so&&so.reverted),n:pr.n,p:pr.p,o:pr.o,a:pr.a});
    }
  }
  return {y:y,picks:picks};
}
/* 结算本届并把结果写回年度计划（v4.27.0：玩家选秀夜与联盟选秀共用同一份；
 * v4.27.3：支持显式传入计划——联盟页面按「下一届」键取计划，不再依赖默认键） */
function resolveDraftForPlan(plan,myPick,me){
  const p=plan||draftPlanFor(curDraftYear());
  const r=resolveDraftInto(p.order,myPick,me);
  p.picks=r.picks;p.resolved=true;
  return r;
}
/* v4.27.2 防剧透：选秀仪式（UI.crm）在念到玩家名字之前，对外仍显示原球队——
 * 顶栏/侧栏/阵容/合同全部走这三个helper，doDraft 提前写入的新球队不外泄。 */
function crmRevealed(){
  if(!UI||!UI.crm)return true;
  const plan=S.draftPlans&&S.draftPlans[String(UI.dy)];
  if(!plan||!plan.picks)return true;
  const meP=plan.picks.filter(p=>p.me)[0];
  return meP?((UI.dr||0)>=meP.pick):((UI.dr||0)>=plan.picks.length);
}
function crmMaskOn(){return !!(UI&&UI.crm&&!crmRevealed());}
function dispTeam(){const p=crmMaskOn()?S._preDraft:null;return p?{team:(p.team||'待定'),league:p.league}:{team:(S.team||'待定'),league:S.league};}
/* 休赛期序列：赛季页「进入下一年」先走两个页面（仅 NBA），再真进下一年 */
function seasonNext(){
  if(!S.retired&&S.league==='NBA'&&S.age<45){
    /* v4.27.3：用「下一届」键（+1）——玩家参选年份与「新秀赛季结束后的休赛期」
     * 同岁（年龄在赛季末才 +1），同键会命中参选年已 resolved 的计划、把页面吞掉；
     * +1 后每一届各有一个键，永不复用。 */
    const plan=draftPlanFor(curDraftYear()+1);
    if(!plan.resolved){UI={mode:'lottery',dy:plan.y,lr:0};save();renderGame();return;}
  }

}
function goDraftDay(){

/* ── 签位资产板（v4.11 P3.1）：每队未来 3 年首轮/次轮，可交易、带保护 ── */
function curDraftYear(){return S.birthYear+S.age;}   /* 当前赛季对应的选秀年（6 月） */
function ensurePickBoard(){
  S.pickBoard=S.pickBoard||{};
  const D=curDraftYear();
  ['nba','cba'].forEach(lg=>{
    const b=S.pickBoard[lg]=S.pickBoard[lg]||{assets:[]};
    (TEAMS[lg]||[]).forEach(t=>{const orig=t[0];
      for(let r=1;r<=2;r++)for(let k=0;k<3;k++){
        const y=D+k;
        if(!b.assets.some(a=>a.y===y&&a.r===r&&a.orig===orig))
          b.assets.push({y,r,orig,owner:orig,prot:null});
      }
    });
    b.assets=b.assets.filter(a=>a.y>=D);   /* 过期年份清理（随赛季自然滚动） */
  });
  return S.pickBoard;
}
function pickAssetOf(lg,y,r,orig){const b=S.pickBoard&&S.pickBoard[lg];return b?(b.assets.find(a=>a.y===y&&a.r===r&&a.orig===orig)||null):null;}
function slotOwnedBy(lg,y,orig,r){const a=pickAssetOf(lg,y,r,orig);return (a&&a.owner)||orig;}
/* 成交一笔签位交易：只能转手「自己拥有」的签——这是不变量的第一道闸 */
function execPickTrade(lg,fromTeam,toTeam,a){
  const t=pickAssetOf(lg,a.y,a.r,a.orig);
  if(!t||t.owner!==fromTeam||fromTeam===toTeam)return null;
  t.owner=toTeam;return t;
}
function pickName(a){return (a.y<=curDraftYear()?'今年':(a.y-curDraftYear())+'年后')+(a.r===1?'首轮签':'次轮签')+'（'+a.orig+'）';}
/* 顺位互换（v4.14 P7）：两队交换各自持有的明年首轮签，保护条款各自保留。
 * 与两笔独立交易不同——互换是同时成交的一笔交易，任一侧不成立则整笔作废。 */
function execSwap(lg,a,b){
  const x=pickAssetOf(lg,a.y,a.r,a.orig),y=pickAssetOf(lg,b.y,b.r,b.orig);
  if(!x||!y||x.owner!==a.owner||y.owner!==b.owner)return null;
  if(a.orig===b.orig||a.owner===b.owner)return null;
  x.owner=b.owner;y.owner=a.owner;
  return [x,y];
}
/* AI 球队间的签位交易：截止日成交 1~2 笔，新闻可见 */
function aiPickTrades(news){
  try{
    ensurePickBoard();
    ['nba','cba'].forEach(lg=>{
      const D=curDraftYear();
      const n=R.chance(.6)?2:1;
      for(let i=0;i<n;i++){
        const b=S.pickBoard[lg];
        const own=b.assets.filter(a=>a.y>D&&a.owner===a.orig&&a.r===1);
        /* v4.14：三成半概率走「顺位互换」——两队交换明年首轮，保护各自保留 */
        if(own.length>=2&&R.chance(.35)){
          const a=R.pick(own);
          const b2=R.pick(own.filter(x=>x.orig!==a.orig&&x.owner!==a.orig));
          const done=b2?execSwap(lg,a,b2):null;
          if(done)news.push('🔁 互换权交易：'+a.orig+' 与 '+b2.orig+' 互换明年首轮签（保护条款各自保留）');
          continue;
        }
        const a=R.pick(own);
        const teams=TEAMS[lg].map(t=>t[0]).filter(t=>t!==a.owner&&t!==a.orig);
        if(!teams.length)continue;
        const to=R.pick(teams);
        if(a.r===1)a.prot=R.int(1,10);   /* 未来首轮带保护：烂队送签自保 */
        const from=a.owner;
        if(!execPickTrade(lg,from,to,a))continue;
        news.push('🔁 签位交易：'+from+' 将 '+pickName(a)+(a.prot?('（前'+a.prot+'保护）'):'')+' 送至 '+to);
      }
    });
  }catch(e){}
}
/* 选秀夜：按资产板解析首轮每个槽位的实际归属（含保护回退），一次结算整晚 */
function draftOwnership(lg,order,year){
  ensurePickBoard();
  return order.map((orig,i)=>{
    const a=pickAssetOf(lg,year,1,orig)||{orig,owner:orig,prot:null};
    let owner=a.owner,reverted=false,comp='';
    if(a.owner!==a.orig&&a.prot!=null&&i<a.prot){
      const buyer=a.owner;
      a.owner=a.orig;owner=a.orig;reverted=true;
      const c=pickAssetOf(lg,year,2,orig);
      if(c&&c.owner===a.orig){c.owner=buyer;comp='，获 '+orig+' 今年次轮签作补偿';}
      else comp='，获现金补偿';
    }
    return {slot:i+1,orig,owner,reverted,comp,prot:a.prot,team:owner};
  });
}
function doDraft(kind,changes){
  if(kind==='cba'){
    const o=ovr();
    /* 落选判定：综评不足 + 概率；或顺位跌出 40 签 */
    if(o<62&&R.chance(.55)){
      S.flags.cbaUnd=true;
      changes.push('CBA选秀遗憾落选…');
      S.log.push({y:seasonLabel(),t:'CBA选秀落选'});
      return;
    }
    let pick;
    if(o>=84)pick=Math.round(R.float(1,3));
    else if(o>=79)pick=Math.round(R.float(2,10));
    else if(o>=74)pick=Math.round(R.float(6,18));
    else if(o>=68)pick=Math.round(R.float(14,30));
    else if(o>=62)pick=Math.round(R.float(24,40));
    else pick=Math.round(R.float(32,44));
    if(pick>40){
      S.flags.cbaUnd=true;
      changes.push('各队相继选择弃权……他的名字最终没有被念到。');
      S.log.push({y:seasonLabel(),t:'CBA选秀落选'});
      return;
    }
    const cm=draftOrderOf('cba');
    const cbaR1=pick<=20;
    const slotTeam=teamAtPick(cm.order,pick);
    const so=cbaR1?draftOwnership('cba',cm.order,curDraftYear())[pick-1]:null;
    const team=so?so.team:slotOwnedBy('cba',curDraftYear(),slotTeam,2);
    const mt=(TEAMS.cba.find(x=>x[0]===team)||[,'6'])[1];
    S.team=team;setJoinStr(team,mt);S.league='CBA';S.ts=3;S.value=baseValue();
    if(!S.played.includes(S.team))S.played.push(S.team);
    setContract(S.team,'CBA',3,'新秀合同',Math.round(wageFor('CBA')*(pick<=3?1.25:pick<=10?1.1:pick<=20?1:.8)));
    S.starter=starterScore()>=70;
    ensureWorld();
    if(!S.honors.some(h=>h.t==='登陆CBA')){S.honors.push({y:seasonLabel(),t:'登陆CBA'});S.log.push({y:seasonLabel(),t:'登陆CBA'});}
    changes.push('🎙️ 第 '+pick+' 顺位：'+team+' 选择了 '+S.name+'！'+(pick<=20?'（首轮）':'（次轮）'));
    if(so&&so.orig!==so.owner)changes.push('📋 该签原属 '+so.orig+(so.reverted?('（前'+so.prot+'保护触发，归还原队'+so.comp+'）'):('，由 '+so.owner+' 交易持有')));
    else if(!cbaR1&&team!==slotTeam)changes.push('📋 次轮该签原属 '+slotTeam+'，由 '+team+' 交易持有');
    const _lt=lottoText(cm.draw,cm.slot);if(_lt)changes.push(_lt);
    changes.push('新秀合同：€'+S.contract.wage+'万/年 · 3年');
    S.log.push({y:seasonLabel(),t:'CBA选秀：'+S.team+'（第'+pick+'顺位）'});
    setTimeout(function(){try{sfx('draft');}catch(e){}},240);
    return;
  }
  const d=ensureDraft();
  if(d.pick!=null&&S.league==='NBA'){changes.push('🎙️ 选秀已经落幕——他已是NBA球员。');return;}
  const o=ovr();
  /* 实际顺位 = 行情 + 选秀夜波动；球队承诺优先兑现 */
  let pick=Math.round(d.stock+R.float(-5,8));
  let promTeam=null;
  if(d.promise&&d.promise.team){
    const idx=d.order.indexOf(d.promise.team);
    if(idx>=0){const slot=idx+1;if(Math.abs(slot-pick)<=12&&R.chance(.72)){pick=slot;promTeam=d.promise.team;}}
  }
  /* 天赋保护：高综评不会出现离谱的顺位下滑 */
  const cap=o>=88?10:o>=84?24:o>=80?42:o>=74?58:70;
  pick=clamp(pick,1,cap);
  if(pick>60){
    S.flags.undrafted=true;
    resolveDraftForPlan(draftPlanFor(curDraftYear()));   /* v4.27.3：显式传计划（参选年键） */
    changes.push('第二轮结束，他的名字依然没有被念到……');
    S.log.push({y:seasonLabel(),t:'NBA选秀落选'});
    return;
  }
  const r1=pick<=30;
  const own1=draftOwnership('nba',d.order,curDraftYear());   /* 首轮全槽位归属，整晚一次结算 */
  const slotTeam=teamAtPick(d.order,pick);
  const so=r1?own1[pick-1]:null;
  const team=so?so.team:slotOwnedBy('nba',curDraftYear(),slotTeam,2);
  const mt=(TEAMS.nba.find(x=>x[0]===team)||[,'5'])[1];
  S._preDraft={team:S.team,teamStr:S.teamStr,ts:S.ts,league:S.league,contract:S.contract};   /* v4.27.2：仪式期间对外仍显示原球队（防剧透） */
  S.team=team;setJoinStr(team,mt);S.league='NBA';S.ts=2;S.value=baseValue();
  if(!S.played.includes(S.team))S.played.push(S.team);
  const years=r1?4:3;
  setContract(team,'NBA',years,'新秀合同',Math.round(wageFor('NBA')*rookieWageMult(pick)));
  S.starter=starterScore()>=78;
  ensureWorld();
  S.flags.undrafted=false;
  d.pick=pick;
  const _dr=resolveDraftForPlan(draftPlanFor(curDraftYear()),pick,{name:S.name,pos:S.pos,ovr:o,age:S.age});   /* v4.27.3：显式传计划（参选年键） */
  changes.push('🎙️ 第 '+pick+' 顺位：'+team+' 选择了 '+S.name+'！'+(r1?'（首轮秀）':'（次轮秀）'));
  if(so&&so.orig!==so.owner)changes.push('📋 该签原属 '+so.orig+(so.reverted?('（前'+so.prot+'保护触发，归还原队'+so.comp+'）'):('，由 '+so.owner+' 交易持有')));
  else if(!r1&&team!==slotTeam)changes.push('📋 次轮该签原属 '+slotTeam+'，由 '+team+' 交易持有');
  if(pick<=14)changes.push('🏅 乐透秀！全家的欢呼把房间淹没。');
  /* v4.27.0：乐透抽签改由「抽签揭晓页」逐个揭牌，结果页不再重复播报 */
  if(promTeam)changes.push('🤝 '+promTeam+' 兑现了试训时的承诺。');
  changes.push('新秀合同：€'+S.contract.wage+'万/年 · '+years+'年');
  changes.push('本届前三：'+_dr.picks.slice(0,3).map(x=>x.team+'选中 '+x.n+((x.orig!==x.owner)?(x.reverted?'（'+x.orig+' 的签，保护触发归还）':'（'+x.orig+' 的签，交易获得）'):'')).join('；'));
  S.log.push({y:seasonLabel(),t:'NBA选秀：'+S.team+'（第'+pick+'顺位）'});
  setTimeout(function(){try{sfx('draft');}catch(e){}},240);
}
function choose(i){
  if(!UI||UI.mode!=='event')return; /* 防重复结算：双击/延迟回调只结算一次 */
  const ev=UI.ev;
  if(!ev||!ev.choices||!ev.choices[i]){UI={mode:'event',ev:safeEvent()};save();renderGame();return;}
  const ch0=ev.choices[i];
  const changes=applyFx(ch0.fx);
  /* 伤病时间化：处置选择写进 S.injury（不是只弹一段文案就完事） */
  if(ch0.injAct){
    const base=ev.id&&ev.id.indexOf('inj_sev')===0?{part:(ev.title||'膝盖').replace('重伤 · ',''),sev:3}
      :(ev.injData||(S.injury?{part:S.injury.part,sev:S.injury.sev}:{part:'脚踝',sev:1}));
    const act=ch0.injAct;
    if(act==='surgery'){injStart(base,45);S.injury.note='手术后长期康复';changes.push('🏥 赛季报销：'+injText());}
    else if(act==='rest'){injStart(base);changes.push('🏥 伤停：'+injText());}
    else if(act==='rush'){injStart(base,Math.max(2,Math.round(R.int(INJ_SEV[base.sev].g[0],INJ_SEV[base.sev].g[1])*.3)));
      S.injury.rein=1;changes.push('🏥 打封闭提前复出：'+injText()+'（复发风险 +10%）');}
    else if(act==='play'){injStart(base,2);S.injury.play=1;changes.push('🏥 带伤出战：'+injText()+'（本季技能打折）');}
    else if(act==='early'){
      const cut=Math.max(1,Math.round(injOut()*.35));
      S.injury.until=Math.max(seasonGamesElapsed()+1,S.injury.until-cut);
      S.injury.rein=1;S.injury.out=injOut();
      changes.push('🏥 提前复出：还缺 '+injOut()+' 场（复发风险 +10%）');
    }else if(act==='limit'){
      const cut=Math.max(1,Math.round(injOut()*.25));
      S.injury.until=Math.max(seasonGamesElapsed()+1,S.injury.until-cut);
      S.injury.out=injOut();S.injury.limit=1;
      changes.push('🏥 限时复出：还缺 '+injOut()+' 场');
    }
  }
  /* 出手结构：这次选择也在改写你的投篮构成（外线选择推高三分占比、内线选择推高罚球率）。
   * 一个生涯 400 多次选择，最后都会在命中率三围与出手结构里看得见。 */
  noteShotChoice(ch0);
  /* 打法倾向（选择进数据）：本次选择的打法计入本季；季后赛期间单独计入本轮系列赛 */
  const st=choiceStyle(ch0);
  if(st){
    if(ev.round){S.po=S.po||{games:0,pts:0,reb:0,ast:0};S.po.tend=tendAdd(S.po.tend,st);}
    else S.tend=tendAdd(S.tend,st);
    S.tendAll=tendAdd(S.tendAll,st);
    const b=ev.round?S.po.tend:S.tend,tw=tendWeight(b);
    changes.push('🧭 打法倾向 '+TEND_NAME[st]+' +1（'+(ev.round?'本次季后赛':'本赛季')+'累计 ×'+b[st]+' → 场均得分'+tendSign(tw.ppg)+' · 场均助攻'+tendSign(tw.apg)+'）');
  }
  if(ev.seriesStage){ /* 季后赛系列赛：一个节点打 1~2 场，逐场出 box（旧版一轮只掷一次骰） */
    playSeriesNode(ev,i);
    return;
  }
  if(ev.game){ /* 焦点战：真的打一场（比分 + box 全部算出来，写进 S.gameLog） */
    const r=simGame(ev.game,st||'auto');
    ev.game.res=r;
    logGame(ev,r);
    S.form=r.form;
    changes.push(`本场 ${r.box.pts}分 ${r.box.reb}板 ${r.box.ast}助${r.box.stl?(' '+r.box.stl+'断'):''}${r.box.blk?(' '+r.box.blk+'帽'):''}（FG ${r.box.fgm}/${r.box.fga}）`);
    changes.push(r.win?`球队取胜（${r.us}:${r.them}）`:`球队落败（${r.us}:${r.them}）`);
    changes.push('手感 → '+Math.round(S.form)+(r.clutch?' · 关键球':''));
    UI={mode:'result',ev,chIdx:i,changes};
    renderResult(ev,i,changes);save();
    return;
  }
  if(ev.round){ /* 季后赛系列赛：结算胜负与数据 */
    const base=(S.playoff&&S.playoff.base)||.5;
    S.playoff=S.playoff||{rounds:0,base:base};
    S.playoff.lastWin=R.chance(clamp(base+((ch0.fx&&ch0.fx.pmod)||0),.1,.95));
    S.po=S.po||{games:0,pts:0,reb:0,ast:0};
    const tw=tendWeight(S.po.tend); /* 打法倾向折算成季后赛数据权重 */
    const o=ovr(),g=ev.round==='playin'?1:R.int(4,7); /* 附加赛一场定胜负 */
    S.po.games+=g;
    S.po.pts+=Math.max(0,Math.round((o*.36-3+tw.ppg+stabAdd()+tsAdd()+R.float(-2,5)*stabMul())*g));
    S.po.reb+=Math.max(0,Math.round((o*.07+((S.pos==='C'||S.pos==='PF')?o*.07:0)+hustleRpgAdd()*.7+R.float(-1,2))*g));
    S.po.ast+=Math.max(0,Math.round((o*.09+(S.pos==='PG'?o*.09:0)+tw.apg+tsNum()*ATTR.tsApg+R.float(-1,2))*g));
    /* 防守数据表同样计入季后赛 */
    const dfsP=defStats();
    S.po.stl=(S.po.stl||0)+Math.round(dfsP.spg*g*10)/10;
    S.po.blk=(S.po.blk||0)+Math.round(dfsP.bpg*g*10)/10;
    if(S.playoff.lastWin&&ev.round!=='playin')S.playoff.rounds=(S.playoff.rounds||0)+1; /* 附加赛不计轮次 */
  }
  /* v4.27.0：玩家 NBA 选秀夜 → 先进「抽签揭牌 → 选秀大会」两个揭晓页，结果页最后再出 */
  if(ch0&&ch0.fx&&ch0.fx.rollDraft==='nba'){
    const _dp=draftPlanFor(curDraftYear());
    if(_dp&&_dp.picks&&_dp.picks.length){
      UI={mode:'lottery',dy:_dp.y,lr:0,crm:{ev:ev,chIdx:i,changes:changes}};
      save();renderGame();return;
    }
  }
  UI={mode:'result',ev,chIdx:i,changes};
  renderResult(ev,i,changes);save();
}

/* 三围的结构（不含随机数）：技能 / 手感 / 对手 / 位置 / 生涯选择 */

/* 一次出手折合多少分：两分/三分命中 + 附带罚球（FGA 反推的分母） */

 * 带来 +3% 的系统性偏差。这里整数部分直接落袋，小数部分按概率抽一次（等价于二项分布抽样）。 */

    fgPct:fgm/Math.max(1,fga),tpPct:tpa?tpm/tpa:0,ftPct:fta?ftm/fta:0,

function pctText(v,d){return (Math.round((v||0)*1000)/10).toFixed(1)+'%';}

  (S.gameLog||[]).forEach(g=>{if(!best||g.b.pts>best.b.pts)best=g;});
  return {n:t.n,w:t.w,l:t.n-t.w,pts:t.pts,reb:t.reb,ast:t.ast,stl:t.stl,blk:t.blk,cl:t.cl,
    ppg:Math.round(t.pts/t.n*10)/10,best:best?{pts:best.b.pts,opp:best.opp,d:best.d}:null};
}
/* 赛季数据 = 焦点战实打 + 剩余场次按效率折算（没有焦点战时与原公式完全一致）
 * 命中率三围走同一套口径：实打场次的出手/命中先累加，剩下的场次按结构期望补，
 * 所以赛季页上的 FG/3P/FT 一定能和 box 对得上。 */
function lineTotals(log){
  const t={fga:0,fgm:0,tpa:0,tpm:0,fta:0,ftm:0,pts:0,n:0};
  (log||[]).forEach(g=>{
    const b=(g&&g.b)||{};t.n++;
    ['fga','fgm','tpa','tpm','fta','ftm','pts'].forEach(k=>{t[k]+=(b[k]||0);});
  });
  return t;
}
/* 单场结构期望 × 场次 → 赛季折算部分（先乘场次再取整，避免逐场四舍五入攒出偏差） */
function lineFromPer(per,games){
  const n=Math.max(0,games||0),r=k=>Math.round(((per&&per[k])||0)*n);
  return {fga:r('fga'),fgm:r('fgm'),tpa:r('tpa'),tpm:r('tpm'),fta:r('fta'),ftm:r('ftm'),pts:r('pts'),n:n};
}
function blendFocus(f){
  const t=focusTotals(S.gameLog);
  const lineOf=(real,restGames)=>{
    const b=lineFromPer(f.line,restGames),a=real||{};
    const m=k=>(a[k]||0)+(b[k]||0);
    return {fga:m('fga'),fgm:m('fgm'),tpa:m('tpa'),tpm:m('tpm'),fta:m('fta'),ftm:m('ftm'),pts:m('pts'),
      n:f.games};
  };
  if(!t.n){
    return {ppg:f.ppg,rpg:f.rpg,apg:f.apg,spg:f.spg,bpg:f.bpg,real:t,realN:0,games:f.games,
      line:lineOf(null,f.games)};
  }
  if(t.n>=f.games){
    return {ppg:Math.round(t.pts/t.n*10)/10,rpg:Math.round(t.reb/t.n*10)/10,apg:Math.round(t.ast/t.n*10)/10,
      spg:Math.round(t.stl/t.n*10)/10,bpg:Math.round(t.blk/t.n*10)/10,real:t,realN:t.n,games:f.games,
      line:lineOf(lineTotals(S.gameLog),0)};
  }
  const mix=(real,perv)=>Math.round(((real+(f.games-t.n)*perv)/f.games)*10)/10;
  return {ppg:mix(t.pts,f.ppg),rpg:mix(t.reb,f.rpg),apg:mix(t.ast,f.apg),
    spg:mix(t.stl,f.spg),bpg:mix(t.blk,f.bpg),real:t,realN:t.n,games:f.games,
    line:lineOf(lineTotals(S.gameLog),f.games-t.n)};
}
/* 焦点战战绩微调排名：该赢的没赢就掉胜场，硬仗赢下来就加胜场（±1~2 场，其余逻辑不动） */
/* 焦点战净胜场：实打的结果 vs 赛前胜率期望，最多 ±2 场（打得好就真的多赢两场） */
function focusWinDelta(){
  const gl=S.gameLog||[];
  if(!gl.length)return 0;
  let real=0,exp=0;
  gl.forEach(g=>{real+=g.w?1:0;exp+=(g.pw||.5);});
  return clamp(Math.round(real-exp),-2,2);
}
/* 没经过 seasonEnd 时的兜底胜率（与 seasonEnd 同公式，但不掷随机数） */
function teamWpcNow(){
  if(S._wpc!=null)return S._wpc;
  return clamp(.5-lgHard().wpc+(S.teamStr-6)*.08+(ovr()-70)*.006,.2,.85);
}
/* 本队战绩的唯一口径：赛季页 / 排名表 / 履历 / 归档读的都是这里。
 *   wins = games ×（胜率 − 缺阵折算）+ 焦点战净胜场
 * 工程约束：两个页面各写一份公式，就会出现「赛季页 46 胜、排名表 52 胜」的假数据。 */
function seasonRecordOf(games,wpc){
  wpc=(wpc!=null)?wpc:teamWpcNow();
  const missed=clamp(Math.round(S.injuryMissed||0),0,games-2);
  const adj=missed>0?clamp(wpc-missed/games*.22,.08,.92):wpc;
  const delta=focusWinDelta();
  const wins=clamp(Math.round(games*adj)+delta,1,games-1);
  return {games,wins,losses:games-wins,missed,adj,delta,wpcAdj:adj};
}
/* 把本队战绩写进排名表：与 computeSeason 同源（含缺阵折算与焦点战净胜场），扣完重新排名次 */
function applyFocusRecord(rows){
  const mine=rows.find(r=>r.team===myTeamName());
  if(mine){
    const rec=seasonRecordOf(gamesInSeason(),teamWpcNow());
    mine.wins=rec.wins;mine.losses=rec.losses;
    mine.injMissed=rec.missed;mine.focus=rec.delta;
  }
  rows.sort((a,b)=>b.wins-a.wins||b.str-a.str);
  rows.forEach((r,i)=>{r.rank=i+1;});
  return rows;
}

function boxHTML(g){

/* ═══════════ 07.06 季后赛系列赛（7 场 4 胜 · 2-2-1-1-1） ═══════════
 * 旧版一轮系列赛只掷一次骰子——这是最不篮球的一处。现在：
 *   · 玩家链路逐场打：每场都走 simGame，出比分与 box，先到 4 胜才结算这一轮；
 *   · 主客场按 2-2-1-1-1：高种子主场 1/2/5/7，客场 3/4/6；主场 pmod 全额、客场减半 → 「客场偷一场」是真目标；
 *   · 每轮 2~4 个节点（一个节点打 1~2 场）：0-2 落后写「更衣室危机」、2-2 写「天王山」、3-3 写「抢七」；
 *   · S.po（季后赛数据）从「每轮掷出来的数字」改成每场 box 累加；
 *   · NPC 之间的系列赛仍然一次性模拟（没人看），只有玩家链路逐场。 */
function seriesStageName(stage){return {r1:'首轮',r2:'半决赛',confFinal:'分部决赛',final:'总决赛'}[stage]||'季后赛';}
function playoffDateFor(stage,g){
  const base={r1:['四月中','四月下'],r2:['五月中','五月下'],confFinal:['五月下','五月下'],final:['六月初','六月中']}[stage]||['四月中','四月下'];
  return g<=2?base[0]:base[1];
}
/* v4.22.0 季后赛对抗烈度：系列赛每个对手都打出超出纸面实力的一档篮球
 * （全民皆兵 + 谁都想掀翻强队）。
 * v4.23.0 二次加压（反馈「还是太简单」）：NBA +1.5→+2.8、CBA +2.5→+4.0、
 * 欧洲 +1.0→+1.5。实测：68 分·强队 59.1%→31.4%、76 分·中强队 50.9%→23.7%、
 * 80 分·头号种子 80.9%→54.0%（500 次完整对阵图，见 patch 头注）。
 * v4.27.4 三次加压（反馈「季后赛还是太简单」）：顶级球星球星闸门 77.7%（ovr88·队形9）
 * 是新的简单来源 → NBA +4.8、CBA +4.8、欧洲 +2.2。实测 88 分档 77.7%→27.9%、
 * 84 分档 35%→7%、老化世界「更新阵容 9.5 仍有 36%」（四轮探针 N=400~800）。
 * 附加赛（掷骰）与 NPC 互打（simWinnerOf）不经此函数，不受影响。 */
function seriesOppStr(game){
  const o=seriesOpponentOf();
  const opp=(o&&o.str)?o.str:6;
  const bump={nba:4.8,cba:4.8,euro:2.2}[myLeagueKey()]||0;
  return Math.round((opp+bump)*10)/10;
}
function seriesOpponentOf(){
  const B=S.bracket;
  if(!B||B.done||B.currentStage==null)return {team:oppTeam(),seed:'?',str:6};
  const m=B.matches[B.currentStage][B.currentMatch];
  const side=B.playerSide==='a'?'b':'a';
  return sideTeam(B,m,side)||{team:oppTeam(),seed:'?',str:6};
}
function seriesStart(stage){
  const o=seriesOpponentOf(),B=S.bracket;
  const mySeed=(B&&B.playerSeed!=null)?B.playerSeed:4;
  const oppSeed=(o&&o.seed!=null&&typeof o.seed==='number')?o.seed:5;
  S.series={stage:stage,w:0,l:0,games:[],opp:o.team,oppSeed:oppSeed,mySeed:mySeed,
    home:mySeed<=oppSeed,lg:myLeagueKey()};   /* 种子更靠前 = 主场优势在我 */
  if(B&&B.currentStage===stage){
    const m=B.matches[stage][B.currentMatch];
    if(m)m.series={w:0,l:0};
  }
  return S.series;
}
/* 2-2-1-1-1：主场优势方打 1/2/5/7 场 */
function seriesHome(g){const hi=[1,2,5,7].indexOf(g)>=0;return S.series?(S.series.home?hi:!hi):hi;}
function seriesGameNo(){return (S.series&&S.series.games?S.series.games.length:0)+1;}
function seriesScoreText(s){
  s=s||S.series;if(!s)return '';
  if(!s.w&&!s.l)return '系列赛 0-0';
  return '系列赛 '+s.w+'-'+s.l+(s.w>s.l?' 领先':(s.w<s.l?' 落后':' 战平'));
}
/* 系列赛文案：随比分生成（0-2 更衣室危机 / 2-2 天王山 / 3-3 抢七 / 赛点 / 生死战） */
function seriesContext(s,nm){
  if(!s.w&&!s.l)return `${nm}第一场。系列赛从零开始，谁能先把对手的节奏打乱，谁就占先手。`;
  if(s.l>=3&&s.w<s.l)return `系列赛 ${s.w}-${s.l}，对手手握赛点。再输一场，这个赛季就结束了。`;
  if(s.w>=3&&s.w>s.l)return `系列赛 ${s.w}-${s.l}，赛点在我们手里。今晚要在主场把它结束掉。`;
  if(s.w===0&&s.l===2)return `0-2 落后。更衣室里没有人说话，教练把战术板擦了三遍。`;
  if(s.w===2&&s.l===2)return `2-2。天王山之战，赢下这一场的人拿到系列赛的主动权。`;
  if(s.w===3&&s.l===3)return `3-3。抢七。所有战术、所有调整都做完了，剩下的只有谁更想赢。`;
  if(s.w<s.l)return `系列赛 ${s.w}-${s.l} 落后。客场偷一场，或者回主场再谈。`;
  return `系列赛 ${s.w}-${s.l} 领先。对面一定会变阵，我们要先想好怎么接。`;

/* 系列赛节点：一个节点打 1~2 场（一个赛季一轮 2~4 个节点） */
function seriesNodeChoices(){
  return [
    ch('进攻端接管比赛',{pmod:.05,outside:1,clutch:1},'他把球要了过来：这一场由我来定走向。','score'),

function evPlayoffSeries(){

    scene:`${seriesScoreText(s)} ｜ 第 ${g} 场在${home?'主场':'客场'}（2-2-1-1-1）。

${seriesContext(s,nm)}`,choices:seriesNodeChoices()};

/* 节点开打：把一个/两个回合真打完（含 box、比分、系列赛比分推进） */
function playSeriesNode(ev,chIdx){
  const st=ev.seriesStage||(S.bracket&&S.bracket.currentStage)||'r1';
  if(!S.series||S.series.stage!==st||S.series.w>=4||S.series.l>=4)seriesStart(st);
  const s=S.series;
  const ch0=ev.choices[chIdx];
  const pmod=(ch0&&ch0.fx&&ch0.fx.pmod)||0;
  const boxes=[],changes=[];
  const w0=s.w,l0=s.l;
  let guard=0;
  while(s.w<4&&s.l<4&&boxes.length<2&&guard++<4){
    const g=s.games.length+1,home=seriesHome(g);
    const game={kind:'playoff',name:seriesStageName(st)+' 第 '+g+' 场',date:playoffDateFor(st,g),
      opp:s.opp,oppStr:seriesOppStr(),home:home,imp:4,lg:myLeagueKey(),
      playoff:{stage:st,gameNo:g,pmod:pmod}};
    const r=simGame(game,pmod>=.05?'score':(pmod>=.04?'pass':'auto'));
    game.res=r;boxes.push(game);
    s.games.push({g:g,home:home?1:0,w:r.win?1:0,us:r.us,them:r.them,b:r.box,pw:r.pw,cl:r.clutch?1:0});
    if(r.win)s.w++;else s.l++;

    const b=r.box;

    S.po.stl=Math.round(((S.po.stl||0)+b.stl)*10)/10;
    S.po.blk=Math.round(((S.po.blk||0)+b.blk)*10)/10;

    changes.push(`第 ${g} 场（${home?'主':'客'}）${r.win?'胜':'负'} ${r.us}-${r.them} ｜ ${b.pts}分${b.reb}板${b.ast}助${b.stl?(' '+b.stl+'断'):''}${b.blk?(' '+b.blk+'帽'):''}（FG ${b.fgm}/${b.fga}）`);
  }

  UI={mode:'result',ev:ev,chIdx:chIdx,changes:changes};

}
/* 系列赛结束后的下一轮事件（跳过没有比赛的轮次） */
function roundEventFor(stage){

  if(stage==='final')return evPlayoffFinal();

}
/* 对阵图上的大比分（3-2 lead） */
function matchSeriesText(stage,idx){
  const B=S.bracket;if(!B)return '';

/* ═══════════ 07.1 赛季结算（含季后赛数据 + NBA个人奖项） ═══════════ */

function injProb(){return .12+(100-S.h.durability)*.0016+(S.age>=33?.06:0)+(S.age>=37?.10:0);}
/* ═══════════ 07.2 排名系统（晋级规则参考现实各联赛） ═══════════ */
/*   CBA  20队：前12名晋级季后赛；1-4名首轮轮空，5-12名打"12进8"附加赛
 *   NBA  30队分东西部：分部前6名直接晋级，第7-10名打附加赛(Play-In，7v8 / 9v10 / 最后一张门票)
 *   欧洲 10队：前6名直接晋级，第7-10名打附加赛（与 NBA 同规则）
 *   青训/NCAA 不参与排名系统（沿用原有结算） */
function seasonGames(lg){return {nba:82,cba:52,euro:34,ncaa:30}[lg]||34;}
function computeStandings(lg){
  /* 唯一口径（v3.9）：一个赛季只摇一次并缓存——排名面板/联盟榜单/赛季总结/报纸全部读同一份 */
  const _sy=seasonLabel();
  /* v4.14：单槽缓存升级为按联赛分槽——旧版换联赛查看会把另一联赛的缓存顶掉，
   * 同一赛季同一联赛反复重摇，排名前后不一致（已知问题清单的「单槽缓存」项）。 */
  if(S._stCache&&S._stCache.rows)S._stCache={};   /* 旧形状单槽缓存一次性迁移 */
  S._stCache=S._stCache||{};
  const _hit=S._stCache[lg];
  if(_hit&&_hit.season===_sy&&Array.isArray(_hit.rows)&&_hit.rows.length){
    return _hit.rows.map(r=>Object.assign({},r));
  }
  const games=seasonGames(lg);
  const rows=(TEAMS[lg]||[]).map(t=>{
    /* 球队实力跟着阵容走：新星崛起 → 球队变强 → 排名上升（静态底子只占 20%，v4.25.0：45%→20%） */
    const st=teamStrength(lg,t[0],t[1]);
    /* 同档球队实力几乎相同：实力系数收窄、随机波动放大，冷门频出 */
    let wpc=clamp(.38+(st-6.5)*.055+R.float(-.17,.17),.06,.94);
    if(t[0]===myTeamName()){
      /* 玩家球队：波动收窄（实力决定命运），并按 OVR 加成；
       * R3（v4.16）：默许摆烂的赛季，胜率压低 15 个百分点（v4.21.2 由 10 上调；验收线 ≥5）——
       * 槽位更差 → 落入保护区 → 选秀夜签位触保回退（v4.11 机制自然兑现） */
      const tankPad=(S.flags.tankYear===(S.birthYear+S.age))?0.15:0;
      const adj=ovr()-70;
      wpc=clamp(.38-lgHard(lg).wpc+(st-6.5)*.055+adj*.003-tankPad+R.float(-.06,.06),.06,.95);   /* v4.20.0：顶星对球队胜率的加成 .005→.003——冠军不再是一人之力 */
    }
    const wins=Math.round(games*wpc);
    return {team:t[0],str:Math.round(st*10)/10,wins,losses:games-wins};
  });
  rows.sort((a,b)=>b.wins-a.wins||b.str-a.str); /* 同胜场按球队实力决名次（tiebreak） */
  rows.forEach((r,i)=>r.rank=i+1);
  S._stCache[lg]={season:seasonLabel(),rows:rows.map(r=>Object.assign({},r))};
  return rows;
}
/* 判定玩家球队季后赛资格，返回 {seed,playin,label,conf,confLabel} 或 null */
function qualify(rows){
  /* 内部自行排序并重算名次，不依赖调用方 */
  const sorted=rows.slice().sort((a,b)=>b.wins-a.wins||b.str-a.str);
  sorted.forEach((r,i)=>r.rank=i+1);
  const lg=myLeagueKey();
  const mine=sorted.find(r=>r.team===myTeamName());
  if(!mine)return null;
  const rank=mine.rank;
  if(lg==='cba'){
    if(rank<=12)return {seed:rank,playin:rank>4,label:rank>4?'CBA 12进8 · 附加赛':'CBA 季后赛'};
    return null;
  }
  if(lg==='nba'){
    const conf=NBA_CONF[myTeamName()];
    if(!conf)return null; /* 分区映射缺失时按无缘季后赛处理，防误判 */
    const confRows=sorted.filter(r=>NBA_CONF[r.team]===conf);
    const cRank=confRows.findIndex(r=>r.team===myTeamName())+1;
    if(cRank<=6)return {seed:cRank,conf,confLabel:conf==='east'?'东部':'西部',playin:false,label:'NBA 季后赛'};
    if(cRank<=10)return {seed:cRank,conf,confLabel:conf==='east'?'东部':'西部',playin:true,label:'NBA 附加赛 Play-In'};
    return null;
  }
  if(lg==='euro'){
    if(rank<=6)return {seed:rank,playin:false,label:'欧洲联赛季后赛'};
    if(rank<=10)return {seed:rank,playin:true,label:'欧洲联赛附加赛'};
    return null;
  }
  return null;
}
/* ═══════════ 07.3 季后赛对阵（独立于四季 · 按种子对阵） ═══════════ */
/* 对阵规则：
 *   CBA  12进8附加赛(5v12 6v11 7v10 8v9，单场淘汰) → 首轮 1v(8/9) 4v(5/12) 2v(7/10) 3v(6/11) → 半决 → 总决
 *   NBA  东西部各自 Play-In 三场(① 7v8 → 7号种子 ② 9v10 ③ 7/8败者 vs 9/10胜者 → 8号种子)
 *        → 分部首轮 1v⑧ 4v5 2v⑦ 3v6 → 分部半决 → 总决赛(东西部冠军对决)
 *        首轮/半决赛对手必为同分部，总决赛才跨分部
 *   欧洲 附加赛同 NBA 规则(7v8、9v10、最后一张门票) → 首轮 1v⑧ 4v5 2v⑦ 3v6 → 半决 → 总决 */
const BRACKET_STAGES=['playin','r1','r2','confFinal','final'];
function infoOf(rows,rank,conf){const r=rows[rank-1];return r?{team:r.team,seed:rank,str:r.str,conf:conf||null}:null;}
function buildBracket(q,rows){
  /* 内部排序重算名次，不依赖调用方 */
  const sorted=rows.slice().sort((a,b)=>b.wins-a.wins||b.str-a.str);
  sorted.forEach((r,i)=>r.rank=i+1);
  const lg=myLeagueKey();
  const B={lg,playerTeam:myTeamName(),playerSeed:q.seed,playerConf:q.conf||null,currentStage:null,currentMatch:0,roundDone:false,matches:{playin:[],r1:[],r2:[],confFinal:[],final:[]},done:false};
  const M=(s,a,b,conf)=>B.matches[s].push({a,b,winner:null,conf:conf||null});
  const ref=(s,i,loser,seedAs)=>({ref:true,s,i,loser:!!loser,seedAs:(seedAs==null?null:seedAs)});   /* loser:true → 指向那一场的败者；seedAs → 出线后的季后赛种子 */
  if(lg==='cba'){
    M('playin',infoOf(sorted,5),infoOf(sorted,12));
    M('playin',infoOf(sorted,6),infoOf(sorted,11));
    M('playin',infoOf(sorted,7),infoOf(sorted,10));
    M('playin',infoOf(sorted,8),infoOf(sorted,9));
    M('r1',infoOf(sorted,1),ref('playin',3));
    M('r1',infoOf(sorted,4),ref('playin',0));
    M('r1',infoOf(sorted,2),ref('playin',2));
    M('r1',infoOf(sorted,3),ref('playin',1));
    M('r2',ref('r1',0),ref('r1',1));
    M('r2',ref('r1',2),ref('r1',3));
    M('final',ref('r2',0),ref('r2',1));
  }else if(lg==='nba'){
    ['east','west'].forEach(conf=>{
      const cRows=sorted.filter(r=>NBA_CONF[r.team]===conf);
      const ci=idx=>({team:cRows[idx].team,seed:idx+1,str:cRows[idx].str,conf});
      const r1Base=B.matches.r1.length,pBase=B.matches.playin.length;
      /* 真实 Play-In（分区内三场）：
       *   ① 7v8 —— 胜者就是季后赛 7 号种子
       *   ② 9v10 —— 败者直接回家
       *   ③ ①的败者 v ②的胜者 —— 胜者才是 8 号种子
       * 所以 7 号种子输掉第一场不会被淘汰（还能打「最后一张门票」），
       * 9/10 的胜者也不能直接进首轮。 */
      M('playin',ci(6),ci(7),conf);                                    /* ① 7v8 */
      M('playin',ci(8),ci(9),conf);                                    /* ② 9v10 */
      M('playin',ref('playin',pBase,true),ref('playin',pBase+1),conf);  /* ③ 7/8败者 v 9/10胜者 */
      /* 首轮按「标准树状顺序」排：1/8-9胜 → 4v5 → 2/7-8胜 → 3v6
       * （这样半决赛的相邻配对才是 (1/8胜) vs (4/5胜)、(2/7胜) vs (3/6胜)，
       *   1、2 号种子最早只能在分部决赛相遇） */
      M('r1',ci(0),ref('playin',pBase+2,false,8),conf); /* 1 号种子 v ⑧号种子（③胜者） */
      M('r1',ci(3),ci(4),conf);                 /* 4v5 */
      M('r1',ci(1),ref('playin',pBase,false,7),conf);   /* 2 号种子 v ⑦号种子（①胜者） */
      M('r1',ci(2),ci(5),conf);                 /* 3v6 */
      M('r2',ref('r1',r1Base),ref('r1',r1Base+1),conf);
      M('r2',ref('r1',r1Base+2),ref('r1',r1Base+3),conf);
      M('confFinal',ref('r2',B.matches.r2.length-2),ref('r2',B.matches.r2.length-1),conf); /* 分部决赛 */
      B.matches.playin[pBase].note='胜者=7号种子';
      B.matches.playin[pBase+1].note='胜者进下一场';
      B.matches.playin[pBase+2].note='胜者=8号种子';
    });
    M('final',ref('confFinal',0),ref('confFinal',1)); /* 东部冠军 v 西部冠军 */
  }else{
    /* 欧洲联赛附加赛（2023-24 起与 NBA 同规则）：
     * 7v8 胜者=7号种子；其败者与 9v10 胜者再打一场，赢家=8号种子。 */
    M('playin',infoOf(sorted,7),infoOf(sorted,8));      /* ① 7v8 */
    M('playin',infoOf(sorted,9),infoOf(sorted,10));     /* ② 9v10 */
    M('playin',ref('playin',0,true),ref('playin',1));   /* ③ 7/8败者 v 9/10胜者 */
    M('r1',infoOf(sorted,1),ref('playin',2,false,8));   /* 1 号种子 v ⑧号种子（③胜者） */
    M('r1',infoOf(sorted,4),infoOf(sorted,5));          /* 4v5 */
    M('r1',infoOf(sorted,2),ref('playin',0,false,7));   /* 2 号种子 v ⑦号种子（①胜者） */
    M('r1',infoOf(sorted,3),infoOf(sorted,6));          /* 3v6 */
    M('r2',ref('r1',0),ref('r1',1));
    M('r2',ref('r1',2),ref('r1',3));
    M('final',ref('r2',0),ref('r2',1));
    B.matches.playin[0].note='胜者=7号种子';
    B.matches.playin[1].note='胜者进下一场';
    B.matches.playin[2].note='胜者=8号种子';
  }
  /* 定位玩家所在对阵 */
  B.currentStage=BRACKET_STAGES.find(s=>B.matches[s].some(m=>(m.a&&m.a.team===B.playerTeam)||(m.b&&m.b.team===B.playerTeam)))||null;
  if(!B.currentStage){B.done=true;return B;} /* 防御：玩家不在对阵中 */
  const mIdx=B.matches[B.currentStage].findIndex(m=>(m.a&&m.a.team===B.playerTeam)||(m.b&&m.b.team===B.playerTeam));
  B.currentMatch=mIdx;
  B.playerSide=B.matches[B.currentStage][mIdx].a.team===B.playerTeam?'a':'b';
  /* 玩家直接晋级时（如1-6号种子），前置轮次（附加赛）必须先全部结算，
     * 首轮对手（附加赛胜者）才在此刻揭晓，不会提前加载 */
  const curIdx=BRACKET_STAGES.indexOf(B.currentStage);
  for(let i=0;i<curIdx;i++){
    B.matches[BRACKET_STAGES[i]].forEach(m=>{if(!m.winner)m.winner=simWinnerOf(B,m);});
  }
  B.roundDone=false;
  return B;
}
/* 解析对阵一侧：引用 → 前置胜者。
 * 严格按轮次：只有"已结束轮次"的结果可被解析；当前轮在玩家打完前全部待定；
 * 未来轮次一律待定——总决赛对阵只有在分部决赛全部结束后才揭晓。 */
/* 未揭晓的引用：给出「来源」提示（7/8 败者 / 9/10 胜者），让附加赛规则本身看得见。
 * 只有来源那一场的两侧都是具体球队时才写（否则只显示「待定」，避免出现 ?/? 这种噪声）。 */
function bktSrcLabel(B,s){
  const p=B.matches[s.s]&&B.matches[s.s][s.i];
  if(!p)return '';
  const seedOf=x=>(x&&!x.ref&&x.seed!=null)?x.seed:null;
  const sa=seedOf(p.a),sb=seedOf(p.b);
  if(sa==null||sb==null)return '';
  return sa+'/'+sb+(s.loser?' 败者':' 胜者');
}
function bktPending(B,s){
  /* 挂上「出线后是几号种子」：待定时也能看到 ⑦/⑧，而不是一片 — */
  return {team:'（待定）',seed:(s.seedAs!=null?s.seedAs:null),str:5,from:bktSrcLabel(B,s)};
}
function sideTeam(B,m,side){
  const s=m[side];
  if(s&&s.ref){
    const prev=B.matches[s.s][s.i];
    /* 赛季已结束(done)时全部轮次都算「已结束」，否则按当前轮次严格判定 */
    const curIdx=B.currentStage?BRACKET_STAGES.indexOf(B.currentStage):(B.done?BRACKET_STAGES.length:-1);
    const prevIdx=BRACKET_STAGES.indexOf(s.s);
    if(prevIdx>curIdx)return bktPending(B,s);                 /* 未来轮次 */
    /* 同轮内引用（附加赛：7/8 的败者、9/10 的胜者都指向「最后一张门票」）：
     * 那一场已经分出胜负就允许揭晓，否则仍是待定。 */
    if(prevIdx===curIdx&&!B.roundDone&&!prev.winner)return bktPending(B,s);
    if(!prev.winner)prev.winner=simWinnerOf(B,prev);
    const win=s.loser?(prev.winner==='a'?'b':'a'):prev.winner; /* 引用败者：取另一侧 */
    const t=sideTeam(B,prev,win); /* 递归解析：胜者侧可能仍是引用 */
    /* 附加赛出线后按「季后赛种子」显示（7v8 胜者=⑦、最后一张门票胜者=⑧） */
    return (s.seedAs!=null&&t)?Object.assign({},t,{seed:s.seedAs}):t;
  }
  return s;
}
/* 结算整轮：玩家比赛结束后，同轮其余比赛才全部决出（严格按轮次推进） */
function settleRound(B,stage){
  B.roundDone=true;
  B.matches[stage].forEach(m=>{if(!m.winner)m.winner=simWinnerOf(B,m);});
}
function simWinnerOf(B,m){
  const a=sideTeam(B,m,'a'),b=sideTeam(B,m,'b');
  /* 实力差影响收窄，系列赛冷门更常见 */
  const pa=clamp(.5+((a&&a.str||5)-(b&&b.str||5))*.04,.25,.75);
  return R.chance(pa)?'a':'b';
}
/* 玩家当前对手（按种子对阵） */
function bracketOpponent(){
  const B=S.bracket;
  if(!B||B.done||B.currentStage==null)return {team:oppTeam(),seed:'?',str:5};
  const m=B.matches[B.currentStage][B.currentMatch];
  const oppSide=B.playerSide==='a'?'b':'a';
  return sideTeam(B,m,oppSide)||{team:oppTeam(),seed:'?',str:5};
}
/* 这一场（若赢下）在下一轮会遇到谁——用于「最后一张门票」的赛前预告 */
function bktNextOppHint(){
  const B=S.bracket;
  if(!B||B.currentStage==null)return '';
  const p=bktParentMap(B)[B.currentStage+'#'+B.currentMatch];
  if(!p)return '';
  const m=B.matches[p.stage][p.idx];
  if(!m)return '';
  const t=sideTeam(B,m,p.side===0?'b':'a');
  return (t&&t.team&&t.team!=='（待定）')?t.team:'';
}
/* 附加赛内部的去向：本场结果有没有「下一场」等着
 * （胜者版找 loser:false 的引用，败者版找 loser:true 的引用；CBA 单场淘汰两边都会返回 -1） */
function bktPlayinDest(B,win){
  const ms=B.matches.playin||[],i=B.currentMatch;
  return ms.findIndex((m,mi)=>mi!==i&&['a','b'].some(sd=>{
    const r=m[sd];
    return r&&r.ref&&r.s==='playin'&&r.i===i&&(win?!r.loser:!!r.loser);
  }));
}
/* 把玩家挪到同一轮的另一个格子：只结算「玩家不参与」的那些场次（按数组顺序，先决出前置结果） */
function bktMoveTo(B,stage,idx){
  B.matches[stage].forEach((m,mi)=>{if(mi!==idx&&!m.winner)m.winner=simWinnerOf(B,m);});
  B.currentStage=stage;B.currentMatch=idx;B.roundDone=false;
  const mm=B.matches[stage][idx],a=sideTeam(B,mm,'a');
  B.playerSide=(a&&a.team===B.playerTeam)?'a':'b';
  return stage;
}
function bracketPlayerWin(){
  const B=S.bracket;
  if(!B||B.done)return 'done';
  const m=B.matches[B.currentStage][B.currentMatch];
  /* 成就·黑马：以更低的种子赢下系列赛（对手种子更高意味着自己是下狗） */
  try{
    const oppN=sideTeam(B,m,B.playerSide==='a'?'b':'a');
    if(oppN&&oppN.seed!=null&&B.playerSeed!=null&&oppN.seed<B.playerSeed){
      codexInit();S.stat.upset=(S.stat.upset||0)+1;
    }
  }catch(e){}
  m.winner=B.playerSide;
  /* 附加赛：赢下 7/8 或 9/10 之后，还可能有一场「最后一张门票」等着（9/10 胜者必须再赢一场） */
  if(B.currentStage==='playin'){
    const dest=bktPlayinDest(B,true);
    if(dest>=0)return bktMoveTo(B,'playin',dest);
  }
  settleRound(B,B.currentStage); /* 本轮全部比赛结束后才进入下一轮 */
  const idx=BRACKET_STAGES.indexOf(B.currentStage);
  /* 跳过没有比赛的轮次：CBA/欧洲没有分部决赛，半决赛之后直接进总决赛 */
  let ns=null;
  for(let j=idx+1;j<BRACKET_STAGES.length;j++){if(B.matches[BRACKET_STAGES[j]].length){ns=BRACKET_STAGES[j];break;}}
  if(!ns){B.done=true;return 'champ';}
  B.currentStage=ns;
  B.roundDone=false;
  const mi=B.matches[ns].findIndex(mm=>{
    const a=sideTeam(B,mm,'a'),b=sideTeam(B,mm,'b');
    return (a&&a.team===B.playerTeam)||(b&&b.team===B.playerTeam);
  });
  if(mi<0){B.done=true;return 'champ';}
  B.currentMatch=mi;
  const mm=B.matches[ns][mi];
  const a=sideTeam(B,mm,'a');
  B.playerSide=(a&&a.team===B.playerTeam)?'a':'b';
  return ns;
}
function bracketPlayerLose(){
  const B=S.bracket;
  if(!B)return;
  const ms=B.matches[B.currentStage];
  if(!ms||B.currentMatch==null||!ms[B.currentMatch]){B.done=true;return;} /* 防御：对阵数据异常时不再推进 */
  const m=ms[B.currentMatch];
  m.winner=B.playerSide==='a'?'b':'a';
  /* 附加赛：7/8 的败者还有一场（对 9/10 胜者）——输一场不等于赛季结束 */
  if(B.currentStage==='playin'){
    const dest=bktPlayinDest(B,false);
    if(dest>=0)return bktMoveTo(B,'playin',dest);
  }
  settleRound(B,B.currentStage); /* 同轮其余比赛照常结算 */
  B.done=true;
}
/* 把剩余所有轮次按顺序模拟完毕（用于赛季结束后确定总冠军） */
function simulateBracketToEnd(B){
  BRACKET_STAGES.forEach(s=>{
    B.currentStage=s;
    B.roundDone=true;
    B.matches[s].forEach(m=>{if(!m.winner)m.winner=simWinnerOf(B,m);});
  });
  B.done=true;
}
/* 确定本赛季总冠军球队：有对阵则模拟完对阵；否则按排名实力加权抽取 */
function determineChampion(){
  if(S.bracket){
    const B=S.bracket;
    simulateBracketToEnd(B);
    const f=B.matches.final[0];
    if(f&&f.winner){
      const wt=sideTeam(B,f,f.winner);
      if(wt&&wt.team&&wt.team!=='（待定）')return wt.team;
    }
  }
  const st=S.standings;
  if(st&&st.rows&&st.rows.length){
    const pool=st.rows.slice(0,8);
    let total=0;
    const ws=pool.map(r=>{const w=Math.max(1,(r.str||5)*(r.wins+10));total+=w;return w;});
    let x=Math.random()*total;
    for(let i=0;i<pool.length;i++){x-=ws[i];if(x<=0)return pool[i].team;}
    return pool[0].team;
  }
  return null;
}
function seasonEnd(){

  S.flags.injDone=false;
  S._tendRS=tendOf(S.tend); /* 打法倾向快照：常规赛数据用它（季后赛期间的选择单独计入季后赛） */
  const o=ovr();
  const youth=S.league==='青训'||S.league==='NCAA';
  const wpc=clamp(.5-lgHard().wpc+(S.teamStr-6)*.08+(o-70)*.006+R.float(-.12,.12),.2,.85); /* v4.5：NBA/CBA 胜率下调 */
  S._wpc=wpc;
  /* 疯狂三月：NCAA 常规赛结束后进入 8 强单场淘汰（对阵图复用那一套渲染），打完再结算赛季 */
  if(S.league==='NCAA'&&!S._marchDone){
    S._marchDone=true;
    const mr=marchRows();
    if(mr.seed<=8){
      S.bracket=marchBuild(mr.rows,mr.seed);
      S.stage='playoffs';
      UI={mode:'event',ev:evMarchIntro()};save();renderGame();return;
    }
    S._noPlayoff=true;   /* 没进 8 强：这一年没有三月 */
  }  if(!youth&&(S.league==='CBA'||S.league==='NBA'||S.league==='欧洲')){
    /* 排名系统：模拟常规赛生成排名，并按现实规则判定季后赛资格；
     * 本队那一行不由「球队实力」决定，而是直接写成年赛季战绩（applyFocusRecord → seasonRecordOf）：
     * 焦点战的真实胜负 ±1~2 场、伤病缺阵按每场 0.22 个胜场折算，全部算在这一个数里。 */
    const rows=applyFocusRecord(computeStandings(myLeagueKey()));
    S.standings={lg:myLeagueKey(),season:seasonLabel(),rows};
    const q=qualify(rows);
    if(q){
      S._noPlayoff=false;
      let pbase=clamp(.28+wpc*.52+(q.seed<=4?.05:q.seed>=10?-.04:0),.3,.82);
      if(myLeagueKey()==='nba')pbase=clamp(pbase*.78,.20,.70);else if(myLeagueKey()==='cba')pbase=clamp(pbase*.9,.26,.76); /* v4.5：NBA .82→.78（封顶 .70）、CBA 新增 .90：夺冠之路全面收紧 */
      S.playoff={rounds:0,base:pbase,seedInfo:q};
      S.bracket=buildBracket(q,rows); /* 生成季后赛对阵（按种子） */
      S.stage='playoffs'; /* 季后赛独立于四季 */
      if(q.playin){
        S.playoff.base=(myLeagueKey()==='nba')?.38:((myLeagueKey()==='cba')?.46:.5); /* 附加赛一场定胜负：基线五成（v4.5：NBA .38 / CBA .46） */
        UI={mode:'event',ev:evPlayIn()};save();renderGame();return;
      }
      UI={mode:'event',ev:evPlayoffIntro()};save();renderGame();return;
    }
    S._noPlayoff=true; /* 排名未达标：无缘季后赛 */
  }
  finishSeason();

function finishSeason(){

  if(_settled){
    /* 已结算过：送回赛季总结（无缓存记录时直接推进到下一季），绝不二次记账 */
    if(S._lastSeasonRes){UI={mode:'season',season:S._lastSeasonRes};save();renderSeason(S._lastSeasonRes);}
    else{nextYear();}

  }
  const champTeam=determineChampion(); /* 奖项页展示用：本赛季总冠军球队 */
  const res=computeSeason(S._playoffResult||null,S._wpc,S.po||null);
  S._finDone=seasonLabel();S._lastSeasonRes=res;   /* 幂等锚点：本赛季正式结算完成 */

   * 保证奖项页/赛季页读到的榜单就是本赛季这一份（也把冠军写进榜单） */
  const E=curBoard()||simWorldStats(res);
  if(E){E.aw.champ=(res.champ?myTeamName():champTeam)||'';}

  const gsum=focusSummary();
  if(gsum)res.gameSum=gsum;
  if(gsum&&S.history&&S.history.length)S.history[S.history.length-1].gs=gsum;
  S.gameLog=[];
  if(S.focus)S.focus=null;

  else res.champTeam=champTeam;

  settleFinance(res);

  codexSeason();              /* 图鉴：本队/联赛/队友/最强队友 */
  /* R3（v4.16）：摆烂赛季的结算文案（renderSeason 展示） */

  UI={mode:'season',season:res};

/* 各联赛的球队场均（得分/篮板/助攻/抢断/盖帽）：全队加起来就是这些数 */
const TEAM_PACE={
  nba:{p:114.5,r:44,a:26.5,s:7.6,b:5.0},
  cba:{p:96,r:41,a:22,s:8.0,b:3.6},
  euro:{p:84,r:36,a:19,s:7.0,b:3.0},
  ncaa:{p:76,r:38,a:15,s:7.0,b:4.0}
};
/* 各位置的产量权重 + 权重随能力的放大指数（抢断/盖帽这种"天赋项"在高能力段放大得更狠） */
const NPC_W={
  reb:{pos:{PG:.62,SG:.75,SF:1.05,PF:2.00,C:3.10},oExp:.60,minExp:1.50},
  ast:{pos:{PG:5.30,SG:1.30,SF:.95,PF:.70,C:.60},oExp:.50,minExp:1.40},
  stl:{pos:{PG:1.90,SG:1.60,SF:1.10,PF:.90,C:.80},oExp:1.60,minExp:1.40},
  blk:{pos:{PG:.35,SG:.50,SF:.85,PF:2.10,C:4.20},oExp:2.40,minExp:1.50},
  pts:{pos:{},oExp:1.20,minExp:1.35}

let NPC_CAL={lg:null,map:null};

function calibrateNpc(lg,myPpg){

  const myTmKey=(typeof myTeamName==='function')?myTeamName():null;
  const map=new Map(),byTm={};
  (S.world[lg]||[]).forEach(p=>{(byTm[p.t]=byTm[p.t]||[]).push(p);});
  Object.keys(byTm).forEach(tm=>{
    const rs=byTm[tm];
    /* 队内能力排名：所有联赛都要赋值（否则非当前联赛全员被当成第 8 人，用法与替补时间失真） */
    rs.slice().sort((a,b)=>(b.o||0)-(a.o||0)).forEach((p,i)=>{p.rrank=i+1;});
    const vt=(myTmKey&&tm===myTmKey)?vac:0;   /* 其余球队不扣：每队各自守恒（球员场均加起来 = 球队场均） */
    const P={p:base.p-vt,r:base.r-vt*.35,a:base.a-vt*.22,s:base.s,b:base.b};
    /* 权重 = 出场时间^minExp × 位置权重 × (能力/70)^oExp
     * 三个幂次一起决定"产量集中度"：minExp 让替补断崖、oExp 让天赋项（抢断/盖帽）集中在少数人身上 */

      r:rs.map(x=>W(NPC_W.reb,x)),
      a:rs.map(x=>W(NPC_W.ast,x)),
      s:rs.map(x=>W(NPC_W.stl,x)),

function npcExpect(p,lg){

  const pps=2*(1-r.share)*r.p2+3*r.share*r.p3+r.ftRate*r.pft;
  return Math.max(1,npcMinutes(p)*npcUsage(p)*1.75*pps);

function npcSeasonLine(p,lg){
  const pos=p.p||'SF',o=p.o||60,a=p.a||26;

  const c=cal?cal.get(p):null;
  const exp=c?c.exp:(p._exp!=null?p._exp:npcExpect(p,lg));
  const l=shootLine({expected:exp,pos:pos,skills:npcSkills(p),form:60,min:min,refMin:32,shot:null,
    oppStr:leagueDefStr(lg==='nba'?'NBA':lg==='cba'?'CBA':lg==='euro'?'欧洲':lg==='ncaa'?'NCAA':'青训'),seasonal:true});
  const rpg=c?c.reb:clamp(Math.round((o*.075+((pos==='C'||pos==='PF')?o*.07:0))*mf+.3),0,17);
  const apg=c?c.ast:clamp(Math.round((o*.055+(pos==='PG'?o*.07:pos==='SG'?o*.02:0))*mf),0,14);
  const spg=c?c.stl:clamp(Math.round(((.55+o/100*1.1)*(DEF_POS.stl[pos]||1))*mf*10)/10,0,4.5);

function npcMvpScore(line,wpc){return (line.ppg||0)*1.6+(line.rpg||0)*.9+(line.apg||0)*.9+wpc*28;}

/* 宿敌：谁一直压着你（MVP 榜压着、抢你的阵容名额、同届同位置一直比） */
function noteRivals(E,myAwards){

  if(E.my.pos>2){
    (E.aw.best||[]).slice(0,Math.max(2,E.my.pos-1)).forEach(x=>{
      if(x[2]!==S.pos)return;

    else if(cfg.defXi[1]&&pd<=4)H.push(cfg.defXi[1]);
  }
  /* 全明星：MVP 榜前 N（联盟规模决定名额），不再是掷骰子 */
  if(cfg.allStar&&cfg.allStarN&&rank('mvp')<=cfg.allStarN)H.push(cfg.allStar);
  /* 最佳新秀：新秀里排第一（只在新秀赛季参评） */
  const rookie=(S.history||[]).filter(h=>h.league===S.league).length<=0&&S.age<=23;
  if(cfg.roy&&rookie&&E.my.mvpRookie===1)H.push(cfg.roy);
  if(!cfg.roy&&rookie&&E.my.mvpRookie===1)H.push('最佳新秀');
  /* v4.20.0：第六人非新秀才给；最佳关键球员门槛提高（前 4 + 大心脏 ≥88） */
  if(cfg.six&&!S.starter&&!rookie&&rank('mvp')<=8)H.push(cfg.six);
  if(cfg.clutch&&rank('mvp')<=4&&(S.skills.clutch||60)>=88)H.push(cfg.clutch);
  return [...new Set(H)];
}

/* ═══ 荣誉竞争：NBA 走这里（数据+战绩的排名，而不是掷骰子） ═══ */
function computeNBAAwards(res){
  ensureWorld();
  const o=ovr();
  const E=curBoard()||simWorldStats(res);
  const H=competeHonors(res,HONOR_CFG.NBA);
  /* 新秀阵容（一阵/二阵）：新秀里的排名，生涯只拿一次 */
  const rookie=(S.nbaSeasons||0)<=1&&S.age<=23;
  if(rookie&&E&&E.my&&!S.flags.newTeamDone){
    const rk=E.my.mvpRookie||999;
    const score=perfScore(res);
    if(rk===1||score>=70){H.push('NBA新秀一阵');S.flags.newTeamDone=true;}
    else if(rk<=5&&score>=55){H.push('NBA新秀二阵');S.flags.newTeamDone=true;}
  }
  /* 总冠军与 FMVP：冠军是打出来的（res.champ），FMVP 还要在队内排名靠前 */
  if(res&&res.champ){
    H.push('NBA总冠军');
    const d=Math.round(S.skills.perdef*.4+S.skills.intdef*.35+S.skills.block*.25+((S.h.hustle||60)-60)*ATTR.hustleDfs);
    const top=E&&E.my&&E.my.mvp<=3;
    /* v4.23.0：FMVP 概率改为随实力起跳——旧公式下限锁死 35%，68 分球员夺冠后
     * 也有 35% 拿 FMVP（59.1% 夺冠率 × 35% ≈ 每季 20%），「角色球员总决赛 MVP」
     * 成为高频事件。新公式：o70 → 5%，o78 → 45%，o82 → 65%，o86+ → 85%。 */
    if(R.chance(clamp(.05+(o-70)*.05+(top?.2:0),.05,.85)))H.push('NBA总决赛MVP（FMVP）');
  }
  /* 进步最快球员：生涯一次，且必须真的比上赛季强 */
  if(!S.flags.gotMIP&&(S.nbaSeasons||0)>=1&&o>=74&&E&&E.my&&E.my.mvp<=12&&R.chance(.35)){
    H.push('NBA进步最快球员');S.flags.gotMIP=true;
  }
  const uniq=[...new Set(H)];
  uniq.forEach(addHonor);
  return uniq;
}
function nextYear(){
  /* v4.20.0：续战硬上限——45 岁开局强制退役（生涯最长打到 45 岁） */
  if(S.age>=45&&!S.retired){S.retired=true;UI={mode:'end'};save();showEnd();return;}
  S.age++;S.stage='spring';S.stageDone=0;S._finDone=null;S.stageTotal=0;S.stageNeed=stageNeedFor();
  S.form=clamp(Math.round((formNow()+60*2)/3),35,90);   /* 休赛期把状态拉回中位 */
  S.focus=null;                                          /* 新赛季重新排焦点战 */
  S._marchDone=false;S._noPlayoff=null;   /* 疯狂三月与季后赛标记按赛季重置 */
  S.injuryMissed=0;S.injuryMissedBase=0;  /* 本季缺阵场次重新计（基数 = 已结清的那几段伤停） */
  if(S.injury){                           /* 伤没好：休赛期不计场次，剩余场次顺延到新赛季 */
    S.injury.until=Math.max(1,S.injury.out);
    S.injury.from=0;S.injury.len=S.injury.until;   /* 计入新赛季：从第 0 场开始算缺阵 */
  }
  S.camp=null;                            /* 上一季的训练营加成到期（秋天会重新选） */
  /* 首发身份随能力重评：打出来了就该进首发（否则巨星会被错发「最佳第六人」） */
  if(S.starter!==true&&S.skills&&(S.league==='NBA'||S.league==='CBA'||S.league==='欧洲')){
    const stTh=S.league==='NBA'?78:(S.league==='CBA'?68:66);
    if(starterScore()>=stTh)S.starter=true;
  }
  worldTick();
  /* 世界推进完立刻接上赛季数据（worldTick 后挂 simWorldStats）：
   * 人才成长/退役/交易发生之后，联盟榜单才反映的是"这一批人"的产出。
   * 若本赛季的榜单在 finishSeason 里已经生成过，这一步是幂等的空操作。 */
  simWorldStats(null);
  if(S.age<=24&&S.skills){
    syncCaps(); /* 先按当前训练积累重算上限：练得多，天花板本身被抬高 */
    SKILLS.forEach(([k])=>{
      const t=capOf(k),cur=S.skills[k];
      /* 未到上限：每年向上限收敛（慢，光靠天赋到不了顶）；
       * 已超上限：超出部分按年衰减（青少年留得住加练的成果，成年后回落更快） */
      const nx=(cur<=t)?(cur+(t-cur)*GROWTH.convUp+R.float(0,2))
                       :(t+(cur-t)*GROWTH.overKeepYouth);
      S.skills[k]=clamp(Math.round(nx),25,99);
    });
  }else if(S.skills&&S.age>=25){
    /* 25 岁以后不再自然成长，但超上限的「加练红利」仍会慢慢回落 */
    SKILLS.forEach(([k])=>{
      const t=capOf(k),cur=S.skills[k];
      if(cur>t)S.skills[k]=clamp(Math.round(t+(cur-t)*GROWTH.overKeep),25,99);
    });
  }
  if(S.age>=29)S.a.athBase=clamp((S.a.athBase||50)-1,20,99);
  if(S.age>=32){S.a.athBase=clamp((S.a.athBase||50)-1,20,99);S.skills.perdef=clamp(S.skills.perdef-1,25,99);S.skills.intdef=clamp(S.skills.intdef-1,25,99);}
  if(S.age>=36){S.a.athBase=clamp((S.a.athBase||50)-2-(injSiteTotal()>=3?1:0),20,99);S.skills.finish=clamp(S.skills.finish-1,25,99);S.skills.dunk=clamp(S.skills.dunk-1,25,99);S.skills.reb=clamp(S.skills.reb-1,25,99);S.skills.speed=clamp(S.skills.speed-1,25,99);}
  if(S.age>41){S.a.athBase=clamp((S.a.athBase||50)-2,20,99);}
  if(S.age>=25&&S.age<=35&&R.chance(.5)){const sk=R.pick(SKILLS)[0];S.skills[sk]=clamp(S.skills[sk]+1,25,99);}
  S.value=baseValue();S.peakV=Math.max(S.peakV,S.value);S.peakO=Math.max(S.peakO,ovr());
  UI={mode:'event',ev:getEvent()};save();renderGame();
}

function careerReview(){

  else if(seas>=6){title='🏀 可靠的职业球员';pool=['他是一位称职的职业球员。','也许他不是最耀眼的那一个，但每支球队都需要这样的人。','稳定的职业生涯，配得上一份体面的告别。'];}

  else{title='💫 匆匆过客';pool=['他的职业之旅如流星划过，短暂却真实地燃烧过。','有些梦想，试过本身就已经值得。','篮球记住了他来过。'];}
  const lines=[R.pick(pool)];
  if(S.played.length===1&&seas>=8)lines.push('一人一城——他把整个职业生涯献给了一支球队。');
  if(natl)lines.push('他穿过绣着国旗的战袍，为国家队拼过命。');
  if(S.played.some(t=>TEAMS.euro.some(e=>e[0]===t)))lines.push('欧洲的战术板，教会了他篮球的另一种语言。');
  if(S.played.some(t=>TEAMS.ncaa.some(e=>e[0]===t)))lines.push('美国大学的疯狂三月，是他青春里最响亮的章节。');
  if(seas===0)lines.push('伤病改写了一切，但勇气不会被抹去。');
  if(S.nbaTries>=3&&!S.played.some(t=>TEAMS.nba.some(e=>e[0]===t)))lines.push('他三番五次向NBA发起冲击，虽未如愿，那份执着令人动容。');
  const td=tendOf(S.tendAll),tdiff=td.score-td.pass; /* 打法倾向：生涯评语 */
  if(td.score+td.pass>=8&&tdiff>=6)lines.push('他的比赛只有一种方式——进攻端接管一切。数据表上那一栏，是他一次次亲手写下的。');
  else if(td.score+td.pass>=8&&tdiff<=-6)lines.push('他是那种先让队友变得更好的人。助攻榜记得他，冠军队友更记得他。');

  return {title,lines};

function shareCardData(){

  const avg=n=>seas?Math.round(n/seas*10)/10:0;

    teams:(S.played&&S.played.length)?S.played.slice():[S.team||'—'],
    honors:(S.honors||[]).map(h=>h.t),

    review:rv};

function drawShareCard(ctx,d){
  const W=720,H=1140,M=36,GOLD='#fbbf24',DIM='#8fa0c4',WHITE='#ffffff';
  const bg=ctx.createLinearGradient(0,0,0,H);bg.addColorStop(0,'#101830');bg.addColorStop(1,'#0a0f1f');
  ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);
  ctx.strokeStyle='#232c44';ctx.strokeRect(6,6,W-12,H-12);
  const wrap=(text,x,y,maxW,lh)=>{
    let line='',yy=y;
    for(const ch0 of String(text)){
      if(ctx.measureText(line+ch0).width>maxW){ctx.fillText(line,x,yy);yy+=lh;line=ch0;}
      else line+=ch0;
    }
    if(line)ctx.fillText(line,x,yy);return yy+lh;
  };
  /* 头部：OVR 徽章 + 名字 */
  ctx.beginPath();ctx.arc(M+46,96,42,0,Math.PI*2);
  ctx.fillStyle='#141d33';ctx.fill();ctx.strokeStyle=GOLD;ctx.lineWidth=2.5;ctx.stroke();
  ctx.fillStyle=GOLD;ctx.font='bold 26px system-ui,"PingFang SC","Microsoft YaHei",sans-serif';ctx.textAlign='center';
  ctx.fillText(String(d.peak),M+46,104);
  ctx.font='10px system-ui,sans-serif';ctx.fillStyle=DIM;ctx.fillText('最高OVR',M+46,120);
  ctx.textAlign='left';
  ctx.fillStyle=WHITE;ctx.font='bold 34px system-ui,"PingFang SC","Microsoft YaHei",sans-serif';ctx.fillText(d.name,M+110,86);
  ctx.fillStyle=DIM;ctx.font='15px system-ui,"PingFang SC",sans-serif';
  ctx.fillText(d.pos+' · '+d.seasons+' 个赛季 · '+d.honorsN+' 项荣誉',M+110,114);
  ctx.fillStyle=GOLD;ctx.font='13px system-ui,"PingFang SC",sans-serif';
  ctx.fillText('篮球生涯 '+d.era+' · '+d.league,M+110,138);
  ctx.strokeStyle='#232c44';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(M,168);ctx.lineTo(W-M,168);ctx.stroke();
  /* 五项场均 */
  const labs=['场均得分','场均篮板','场均助攻','场均抢断','场均盖帽'];
  const keys=['pts','reb','ast','stl','blk'];
  const bw=(W-M*2-16)/5;
  keys.forEach((k,i)=>{
    const x=M+i*(bw+4);
    ctx.fillStyle='#0c1326';ctx.fillRect(x,186,bw,70);
    ctx.strokeStyle='#1e2740';ctx.strokeRect(x,186,bw,70);
    ctx.fillStyle=WHITE;ctx.font='bold 21px system-ui,sans-serif';ctx.textAlign='center';
    ctx.fillText(String(d.stats[k]),x+bw/2,220);
    ctx.fillStyle=DIM;ctx.font='11px system-ui,"PingFang SC",sans-serif';ctx.fillText(labs[i],x+bw/2,242);
    ctx.textAlign='left';
  });
  /* 效力球队 */
  ctx.fillStyle=DIM;ctx.font='12px system-ui,"PingFang SC",sans-serif';ctx.fillText('效力球队',M,288);
  ctx.fillStyle='#cfe0ff';ctx.font='14px system-ui,"PingFang SC",sans-serif';
  let ty=wrap(d.teams.join('  ➔  '),M,310,W-M*2,22);
  /* 得分曲线 */
  ctx.fillStyle=DIM;ctx.font='12px system-ui,"PingFang SC",sans-serif';ctx.fillText('生涯场均得分曲线',M,ty+12);
  if(d.rows.length>1){
    const gx=M,gy=ty+30,gw=W-M*2,gh=110;
    const mx=Math.max(10,...d.rows.map(r=>r.ppg))*1.15;
    const px=i=>gx+i*gw/(d.rows.length-1);
    const py=v=>gy+gh-(v/mx)*gh;
    ctx.strokeStyle='#28324a';ctx.beginPath();ctx.moveTo(gx,gy+gh);ctx.lineTo(gx+gw,gy+gh);ctx.stroke();
    ctx.strokeStyle='#fbbf24';ctx.lineWidth=2.4;ctx.beginPath();
    d.rows.forEach((r,i)=>{i?ctx.lineTo(px(i),py(r.ppg)):ctx.moveTo(px(i),py(r.ppg));});
    ctx.stroke();
    ctx.fillStyle=GOLD;
    d.rows.forEach((r,i)=>{ctx.beginPath();ctx.arc(px(i),py(r.ppg),3.4,0,Math.PI*2);ctx.fill();});
    ctx.fillStyle=DIM;ctx.font='11px system-ui,sans-serif';
    ctx.fillText(d.rows[0].y,gx,gy+gh+18);
    const last=d.rows[d.rows.length-1];
    ctx.fillText(last.y,gx+gw-ctx.measureText(last.y).width,gy+gh+18);
    ty=gy+gh+34;
  }else{
    ctx.fillStyle=DIM;ctx.fillText('没有逐季数据可画',M,ty+34);ty=ty+46;
  }
  /* 荣誉墙 */
  ctx.fillStyle=DIM;ctx.font='12px system-ui,"PingFang SC",sans-serif';ctx.fillText('荣誉墙（'+d.honorsN+'）',M,ty+14);
  ctx.font='13px system-ui,"PingFang SC",sans-serif';
  let hy=wrap(d.honors.length?('🏅 '+d.honors.join('  🏅 ')):'荣誉墙虚位以待',M,ty+40,W-M*2,22);
  /* 评语 */
  ctx.fillStyle='#fb923c';ctx.font='bold 15px system-ui,"PingFang SC",sans-serif';
  ctx.fillText(rvText(d.review),M,hy+26);
  ctx.fillStyle='#c9d4ec';ctx.font='14px system-ui,"PingFang SC",sans-serif';
  hy=wrap(d.review.lines[0]||'',M,hy+52,W-M*2,22);
  /* 页脚 */
  ctx.fillStyle='#4a5a80';ctx.font='11px system-ui,sans-serif';ctx.textAlign='center';
  ctx.fillText('篮球人生 · 生涯模拟 · 图片分享卡',W/2,H-24);ctx.textAlign='left';
}
function rvText(d){return d&&d.title?d.title:'🏀 篮球生涯';}
function shareCardPNG(){

    const cv=document.createElement('canvas');cv.width=720;cv.height=1140;

      if(!b){shareCardDL();return;}

      a.download='篮球人生分享卡-'+data.name+'.png';

      toast('📸 PNG 分享卡已生成');
      S.log=S.log||[];S.log.push({y:seasonLabel(),t:'生成了 PNG 分享卡'});
    },'image/png');
    return 'png';
  }catch(e){try{toast('生成失败：'+(e&&e.message||e));}catch(_){ } return 'err';}
}

/* 逐季数据（S.history）存的是「场均」，S.career.pts/stl/blk 存的是各赛季场均之和——
 * 想判断「生涯总量」必须乘上那个赛季打了几场，否则一万分这种门槛一个数量级都够不到。
 * 场次口径：职业联赛用 seasonGames()，青训联赛按 14 场（与 computeSeason 的赛季长度一致）。 */
const CAREER_GAMES={NBA:82,CBA:52,'欧洲':34,NCAA:30,'青训':14};
function careerT(k){
  /* 逐季数据里助攻存的是 apg（场均字段名），而调用方习惯写 'ast'——
   * 不归一化的话「生涯助攻总量」会永远算成 0（档案页与助攻类成就都吃这个亏）。 */
  const key=(k==='ast')?'apg':k;
  /* 出场数按逐季实际场次：伤停缺阵的赛季不能按满勤累加生涯总量 */
  return (S.history||[]).reduce((s,h)=>s+(h[key]||0)*(h.games||CAREER_GAMES[h.league]||34),0);
}

const ACH_PTS={bronze:5,silver:12,gold:25};
function achHas(id){return !!(S.ach&&S.ach[id]);}
function achPts(){return ACHIEVEMENTS.reduce((s,a)=>s+(achHas(a.id)?(ACH_PTS[a.tier]||5):0),0);}
function achMaxPts(){return ACHIEVEMENTS.reduce((s,a)=>s+(ACH_PTS[a.tier]||5),0);}
/* 复算一遍所有条件，返回本次新解锁的成就 */
function achCheck(silent){
  if(!S||!S.ach)return [];
  const fresh=[];
  ACHIEVEMENTS.forEach(a=>{
    if(S.ach[a.id])return;
    let ok=false;
    try{ok=!!a.chk();}catch(e){ok=false;}
    if(ok){S.ach[a.id]={y:seasonLabel()};fresh.push(a);}
  });
  if(fresh.length&&!silent)achNotify(fresh);
  return fresh;
}
function achNotify(list){
  const box=document.getElementById('achpop');
  if(!box)return;
  box.innerHTML=`<b>🏆 成就解锁 ${list.length} 项</b><span>${list.map(a=>a.n).join(' · ')}</span>`;
  box.classList.add('on');
  if(sfx)sfx('achieve');
  if(achNotify._t)clearTimeout(achNotify._t);
  achNotify._t=setTimeout(()=>box.classList.remove('on'),4200);
}
/* ── 图鉴登记：事件 / 球队 / 联赛 / 队友 ── */
function codexInit(){
  S.ach=S.ach||{};
  S.codex=S.codex||{};
  S.codex.ev=S.codex.ev||{};S.codex.teams=S.codex.teams||{};
  S.codex.mates=S.codex.mates||{};S.codex.lg=S.codex.lg||{};
  S.stat=S.stat||{};
  ['drama','story','upset','mateBest','games','gwin','gpts','gclutch','g30','g40','gbest'].forEach(k=>{if(typeof S.stat[k]!=='number')S.stat[k]=0;});
  /* 比赛层：老存档补手感与战报数组 */
  if(typeof S.form!=='number')S.form=60;
  if(!Array.isArray(S.gameLog))S.gameLog=[];
  if(S.focus===undefined)S.focus=null;
  if(S.series===undefined)S.series=null;   /* 季后赛系列赛状态：老存档从 null 开始 */
}
function codexN(k){return Object.keys((S.codex&&S.codex[k])||{}).length;}
function codexEv(ev){
  if(!ev||!ev.id||ev.ai)return;
  codexInit();
  const y=seasonLabel();
  if(!S.codex.ev[ev.id])S.codex.ev[ev.id]={y:y,k:evKindOf(ev)};
}
function codexTeam(team,league){
  if(!team)return;
  codexInit();
  const y=seasonLabel();
  const t=S.codex.teams[team]||(S.codex.teams[team]={first:y,seasons:0,lg:league||S.league});
  t.seasons=(t.seasons||0)+1;t.lg=league||t.lg||S.league;t.last=y;
  const lg=league||S.league;
  if(lg){const r=S.codex.lg[lg]||(S.codex.lg[lg]={first:y,seasons:0});r.seasons=(r.seasons||0)+1;r.last=y;}
}
/* 赛季结算时更新图鉴：本队、联赛、队友、最强队友 */
function codexSeason(){
  codexInit();
  codexTeam(S.team,S.league);
  const rs=teamRoster();
  let best=0;
  rs.forEach(p=>{
    const rec=S.codex.mates[p.n]||(S.codex.mates[p.n]={first:seasonLabel(),seasons:0,best:0});
    rec.seasons=(rec.seasons||0)+1;rec.best=Math.max(rec.best||0,p.o);rec.team=S.team;
    if(p.o>best)best=p.o;
  });
  if(best>S.stat.mateBest)S.stat.mateBest=best;
}
/* 事件图鉴的收集度：池子里的条目 + 剧情线段落 */
function codexRate(){
  const pools=[['spring','春'],['summer','夏'],['autumn','秋'],['winter','冬'],
                ['youthSpring','青训春'],['youthSummer','青训夏'],['youthAutumn','青训秋'],['youthWinter','青训冬']];
  let total=0,got=0;
  const rows=pools.map(([k,n])=>{
    const list=POOLS[k]||[];
    const ids=list.map(e=>e.id);
    const g=ids.filter(id=>S.codex&&S.codex.ev&&S.codex.ev[id]).length;
    total+=ids.length;got+=g;
    return {k:k,n:n,got:g,size:ids.length};
  });
  const storyIds=Object.keys(STORY);
  const sg=storyIds.filter(id=>S.codex&&S.codex.ev&&S.codex.ev[id]).length;
  total+=storyIds.length;got+=sg;
  rows.push({k:'story',n:'剧情线',got:sg,size:storyIds.length});
  return {rows:rows,got:got,total:total,rate:total?got/total:0};
}
function achGroup(list){
  const g={};
  list.forEach(a=>{(g[a.k]=g[a.k]||[]).push(a);});
  return g;
}
function achRow(a){
  const on=achHas(a.id),rec=S.ach[a.id]||null;
  const _ic=ACH_ICON[a.id]&&ACH_ICONS[ACH_ICON[a.id]]?ACH_ICONS[ACH_ICON[a.id]]:null;
  let pr='';
  if(!on&&a.prog){
    let p=null;
    try{p=a.prog();}catch(e){p=null;}
    if(p&&p[1])pr=`<div class="achbar"><i style="width:${clamp(Math.round(p[0]/p[1]*100),0,100)}%"></i></div>
      <i style="margin-top:3px">进度 ${Math.round(p[0])} / ${p[1]}</i>`;
  }
  return `<div class="achrow ${on?'on':'off'}">
    <div class="achic" style="color:${on?ACH_TIER[a.tier]:'#64748b'}">${_ic?`<img src="${_ic}" alt="" loading="lazy" decoding="async" fetchpriority="low">`:(on?'🏆':'🔒')}</div>
    <div class="achbody"><b>${esc(a.n)}</b><i>${esc(a.d)}</i>${pr}</div>
    <div class="achmeta">${on?(esc(rec&&rec.y||'已达成')):('<span style="color:'+ACH_TIER[a.tier]+'">'+({gold:'金',silver:'银',bronze:'铜'}[a.tier]||'')+'</span>')}<br>${ACH_PTS[a.tier]||5} 分</div>
  </div>`;
}
function showCodex(tab){
  tab=tab||'ach';
  codexInit();
  achCheck(true);         /* 打开面板时复算一次，历史的成绩不会漏 */
  const got=ACHIEVEMENTS.filter(a=>achHas(a.id)).length;
  const cr=codexRate();
  let h=`<h3>🏆 成就与图鉴</h3>
  <div class="achsum"><div><div class="big">${got}<span style="font-size:14px;color:var(--muted)">/${ACHIEVEMENTS.length}</span></div>
   <div class="mini" style="margin:0">成就 ${achPts()} / ${achMaxPts()} 分</div></div>
   <div style="flex:1"><div class="achbar" style="height:7px"><i style="width:${Math.round(got/ACHIEVEMENTS.length*100)}%"></i></div>
   <div class="mini" style="margin-top:3px">事件图鉴 ${cr.got}/${cr.total}（${Math.round(cr.rate*100)}%） ｜ 效力球队 ${codexN('teams')} ｜ 交过手的队友 ${codexN('mates')} ｜ 联赛 ${codexN('lg')}</div></div></div>
  <div class="tabbar">
   <button class="${tab==='ach'?'on':''}" onclick="showCodex('ach')">🏆 成就</button>
   <button class="${tab==='ev'?'on':''}" onclick="showCodex('ev')">📖 事件图鉴</button>
   <button class="${tab==='team'?'on':''}" onclick="showCodex('team')">🛡 球队</button>
   <button class="${tab==='mate'?'on':''}" onclick="showCodex('mate')">👥 队友</button>
  </div>`;
  if(tab==='ach'){
    const g=achGroup(ACHIEVEMENTS);
    Object.keys(g).forEach(k=>{
      const l=g[k],n=l.filter(a=>achHas(a.id)).length;
      h+=`<label>${k} · ${n}/${l.length}</label>${l.map(achRow).join('')}`;
    });
  }else if(tab==='ev'){
    h+=`<div class="mini">每翻开一页剧情就会登记在图鉴里；点亮的条目可以回看当时的故事。</div>`;
    cr.rows.forEach(r=>{
      const list=(r.k==='story'?Object.keys(STORY).map(id=>STORY[id]):(POOLS[r.k]||[]));
      h+=`<label>${r.n} · ${r.got}/${r.size}</label><div class="cxgrid">`+
        list.map(e=>{
          const seen=S.codex.ev[e.id];

/* ---- 存档导出 / 导入 ----
 * localStorage 是单点：玩家清一次浏览器数据，主存档和 .autobak 备份会一起没。
 * 这里给一条玩家自己能掌控的退路——导出成 JSON 文件（或一段文本）随身带走，
 * 换电脑 / 换浏览器 / 换域名之后粘回来，接着打。
 */
function saveStamp(){
  const d=new Date(),p=n=>String(n).padStart(2,'0');
  return d.getFullYear()+p(d.getMonth()+1)+p(d.getDate())+'-'+p(d.getHours())+p(d.getMinutes());
}
function exportSave(){
  /* 主菜单里 S 是空的，但存档还在 localStorage —— 那种情况直接导出存着的那份 */
  let j='';
  if(S){j=saveJson();}
  else{try{j=localStorage.getItem(CFG.SAVE_KEY)||'';}catch(e){j='';}}
  if(!j){toast(S?'⚠️ 导出失败：存档序列化出错':'还没有存档可以导出，先开始一局吧');return;}
  let nm='';
  try{nm=((JSON.parse(j)||{}).S||{}).name||'';}catch(e){}
  const name='hooplife-存档-'+saveStamp()+(nm?'-'+String(nm).replace(/[\\/:*?"<>|\s]+/g,''):'')+'.json';
  try{
    const url=URL.createObjectURL(new Blob([j],{type:'application/json'}));
    const a=document.createElement('a');
    a.href=url;a.download=name;document.body.appendChild(a);a.click();
    setTimeout(()=>{try{URL.revokeObjectURL(url);a.remove();}catch(_){}},1500);
    toast('📤 已导出 '+name+'（'+(j.length/1024).toFixed(0)+' KB）');
  }catch(e){
    /* 少数环境禁用了 a[download]：退回到「复制文本」，别让这条路直接断掉 */
    showSaveText(j,'📤 存档文本（手动复制保存）',
      '你的浏览器拦下了自动下载。把下面整段复制走，存成 .json 文件；下次用「📥 导入存档」粘回来即可。');
  }
}

function importSaveFile(ev){
  const f=ev.target.files&&ev.target.files[0];if(!f)return;
  const r=new FileReader();
  r.onload=()=>{try{applySaveText(String(r.result||''));}catch(e){toast('读取文件失败');}};
  r.onerror=()=>toast('读取文件失败');
  r.readAsText(f,'utf-8');
  ev.target.value='';   /* 清空，方便连续选同一个文件 */

function applySaveText(txt){
  txt=String(txt||'').replace(/^\uFEFF/,'').trim();
  if(!txt){toast('粘贴框是空的');return;}
  let d=null;
  try{d=JSON.parse(txt);}catch(e){d=null;}
  if(!d||!d.S||typeof d.S!=='object'){toast('⚠️ 这段内容不是本游戏的存档');return;}
  /* 来自更新版本的存档先拦一下：字段含义可能已经变了，硬读会得到一局诡异的数据 */
  if(typeof d.v==='number'&&d.v>CFG.SAVE_VER){
    if(!confirm('这个存档来自更新的版本（v'+d.v+' > 当前 v'+CFG.SAVE_VER+'），读取后可能出现异常。仍然继续？'))return;
  }
  const nm=(d.S&&d.S.name)||'未知',age=(d.S&&d.S.age)||'?';
  if(!confirm('导入会覆盖当前存档：'+nm+' · '+age+'岁。\n确定继续吗？（旧存档会先自动备份，之后可用「恢复自动备份」找回）'))return;
  try{_autoBak();localStorage.setItem(CFG.SAVE_KEY,JSON.stringify({v:CFG.SAVE_VER,S:d.S,UI:d.UI||null}));}
  catch(e){toast('⚠️ 写入失败：浏览器存储空间可能已满');return;}
  S=null;UI=null;
  closeOvl();
  try{continueGame();}catch(e){renderMenu();}
  toast('📥 已导入存档：'+nm+' · '+age+'岁');
}

function animCount(el,to,dur){
  if(!el||!window.requestAnimationFrame)return;
  if(window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches)return;
  const t0=performance.now(),from=Math.max(0,to-14);
  function step(t){
    const k=Math.min(1,(t-t0)/(dur||520));
    el.textContent=Math.round(from+(to-from)*(1-Math.pow(1-k,3)));
    if(k<1)requestAnimationFrame(step);else el.textContent=to;
  }
  requestAnimationFrame(step);
}

function radarSVG(w,h,labels,keys){

/* ── 生涯曲线：按赛季画一条折线（数据来自 S.history，每季结算时写入） ── */
let SPARK_SEQ=0;
function sparkSVG(key,unit,w,h){
  const hist=(S.history||[]).filter(x=>x&&x[key]!=null);
  if(hist.length<2)return '<div class="mini">📈 生涯曲线：再完成一个赛季就会出现走势</div>';
  const sparkId=++SPARK_SEQ;   /* 同页可能画多条曲线，渐变 id 必须唯一 */
  const vals=hist.map(x=>x[key]);
  const mx=Math.max.apply(null,vals),mn=Math.min.apply(null,vals);
  const top=Math.max(mx,mn+1)*1.06,bot=Math.max(0,mn*0.9);
  const X=i=>16+(w-34)*i/(hist.length-1);
  const Y=v=>h-16-((v-bot)/((top-bot)||1))*(h-32);
  const pts=vals.map((v,i)=>`${X(i).toFixed(1)},${Y(v).toFixed(1)}`);
  let g='';
  for(let k=0;k<=3;k++){const y=(h-20)*k/3+6;
    g+=`<line x1="12" y1="${y.toFixed(1)}" x2="${w-8}" y2="${y.toFixed(1)}" stroke="#1c2333" stroke-width="1"/>`;}
  g+=`<polygon points="16,${h-16} ${pts.join(' ')} ${(w-18).toFixed(1)},${h-16}" fill="url(#sparkFill${sparkId})" opacity=".5"/>`;
  g+=`<polyline points="${pts.join(' ')}" fill="none" stroke="#f97316" stroke-width="2.2" stroke-linejoin="round"/>`;
  vals.forEach((v,i)=>{const last=i===vals.length-1;
    g+=`<circle cx="${X(i).toFixed(1)}" cy="${Y(v).toFixed(1)}" r="${last?4:2.4}" fill="${last?'#fbbf24':'#ffb37a'}"/>`;});
  const lx=X(vals.length-1),ly=Y(vals[vals.length-1]);
  g+=`<text x="${Math.min(lx,w-30).toFixed(1)}" y="${(ly-9).toFixed(1)}" text-anchor="middle" font-size="11" font-weight="700" fill="#fbbf24">${vals[vals.length-1]}${unit}</text>`;
  g+=`<text x="16" y="12" font-size="10" fill="#6d7688">最高 ${mx}${unit} ｜ 最低 ${mn}${unit}</text>`;
  g+=`<text x="16" y="${h-4}" font-size="10" fill="#6d7688">${esc(hist[0].y)}</text>`;
  g+=`<text x="${w-8}" y="${h-4}" text-anchor="end" font-size="10" fill="#6d7688">${esc(hist[hist.length-1].y)}</text>`;
  return `<svg class="spark" viewBox="0 0 ${w} ${h}" width="100%" height="${h}" aria-hidden="true">
    <defs><linearGradient id="sparkFill${sparkId}" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f97316" stop-opacity=".55"/>
      <stop offset="1" stop-color="#f97316" stop-opacity="0"/></linearGradient></defs>${g}</svg>`;
}

function artMood(ev){
  const t=((ev&&ev.title)||'')+' '+((ev&&ev.scene)||'');
  /* 「无缘季后赛」里含「季后赛」，先排除，否则赛季总结会抽到生死战插画 */
  if(/无缘季后赛|未能进入季后赛|没进季后赛|提前放假|赛季提前结束/.test(t))return 'court';
  /* v4.7 新场景（8）：疯狂三月 / 新援 / 选秀 / 国家队 / 青葱 / 首秀 / 抉择 / 谢幕 */
  if(/疯狂三月/.test(t))return 'march';
  if(/新援|自由球员|加盟|初入队|球队变动/.test(t))return 'newteam';
  if(/选秀|试训|落选/.test(t))return 'draft';
  if(/国家队|国青|国字号|国手/.test(t))return 'nation';
  if(/天赋初现|毕业|校园|期末|人生路口|招募/.test(t))return 'youth';
  if(/首秀|第一次登场/.test(t))return 'debut';
  if(/抉择|十字路口|巅峰|身体的信号/.test(t))return 'crossroad';
  if(/退役|谢幕|终章|落幕/.test(t))return 'farewell';
  if(/夺冠|总冠军|颁奖|领奖|庆典|举起了奖杯|冠军之夜/.test(t))return 'champion';
  if(/季后赛|系列赛|附加赛|天王山|抢七|生死战|淘汰|总决赛|分部决赛|半决赛|首轮|八强|四强|止步/.test(t))return 'playoff';
  if(/更衣室|队友|冲突|矛盾|气氛|袖标|领袖|聚餐|团建/.test(t))return 'locker';
  if(/训练|加练|特训|体测|力量|体能|投篮|技术|教练组/.test(t))return 'gym';
  if(/发布会|记者|媒体|采访|镜头|热搜|舆论/.test(t))return 'press';
  if(/伤病|受伤|康复|理疗|医生|手术|养伤|带伤/.test(t))return 'injury';
  if(/合同|签约|转会|经纪人|谈判|续约|报价|条款|买断|球员选项|底薪|降薪|交易/.test(t))return 'office';
  if(/深夜|雨|雪|夜路|街头|回家路上|凌晨/.test(t))return 'night';
  if(/父母|母亲|父亲|家人|家里|团圆|故乡|母亲/.test(t))return 'home';
  return 'court';
}

function showEvent(ev){
  if(!ev||!ev.choices||!ev.choices.length){ev=safeEvent();}
  codexEv(ev);   /* 图鉴：每翻开一页剧情就登记一次（含特定事件与剧情线段落） */
  /* 剧情节点自带音效：落幕低音 / 夺冠号角+欢呼 / 伤病闷响 / 里程碑闪音 / 训练营运球 / 焦点战开场哨 */
  if(ev.id==='pexit')sfx('curtain');
  else if(ev.id==='pchamp'||ev.id==='march_champ')sfx('fanfare');
  else if(ev.id==='march_exit')sfx('buzzer');
  else if(String(ev.id||'').indexOf('inj')===0&&ev.id!=='inj_ret')sfx('injury');
  else if(String(ev.id||'').indexOf('ms_')===0)sfx('achieve');
  else if(String(ev.id||'').indexOf('camp_')===0)sfx('dribble');
  else if(ev.game&&!ev.game.res&&!ev.seriesStage)sfx('refwhistle');

    +'<span class="kbhint"> ｜ ⌨️ 数字键 1-9 直接选，↑↓ 移动、Enter 确认</span>';
