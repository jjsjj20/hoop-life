function renderResult(ev,i,changes){
  const ch0=ev&&ev.choices?ev.choices[i]:null;
  if(!ch0){UI={mode:'event',ev:safeEvent()};save();renderGame();return;}
  let po='',voiced=false;
  if(ev.seriesState){ /* 系列赛节点：比分横幅（逐场打完的 3-2 / 4-1 …） */
    const ss=ev.seriesState;
    po=`<div class="po-score">🏀 ${esc(seriesStageName(ss.stage))} 系列赛 <b>${ss.w}-${ss.l}</b> vs ${esc(ss.opp)}`+
      (ss.w>=4?' ｜ 晋级下一轮！':(ss.l>=4?' ｜ 赛季结束':' ｜ 还没结束'))+'</div>';
    /* 系列赛的这一节打成什么样，就出什么样的声：赢下系列赛/被淘汰各一次，单个节点按本节点胜负 */
    if(ss.w>=4){if(!ev._sfxDone){ev._sfxDone=1;sfx('win');}voiced=true;}
    else if(ss.l>=4){if(!ev._sfxDone){ev._sfxDone=1;sfx('lose');}voiced=true;}
    else{sfx((ev.nodeWins||0)>=(ev.nodeLosses||0)?'up':'down');voiced=true;}
  }else if(ev.game&&ev.game.res){ /* 单场焦点战：赢了上行、输了下滑（别让输球跟涨数据一样响） */
    sfx(ev.game.res.win?'swish':'rim');voiced=true;
  }else if(ev.round&&!ev.seriesStage&&S.playoff&&S.playoff.lastWin!==undefined){
    po=S.playoff.lastWin?'<div class="po-win">🏀 系列赛胜出！晋级下一轮</div>':'<div class="po-lose">🏀 系列赛失利，赛季结束</div>';
    sfx(S.playoff.lastWin?'win':'lose');   /* 系列赛结果：胜出/失利各有一声 */

  <div class="panel"><b>【状态面板】</b><br>
  <span class="kv"><i>球员</i> ${esc(S.name)} · ${S.age}岁 · ${POS[S.pos].n}

 * 但「不白屏」不等于「当没发生」——早先这里完全静默，真实 bug 永远暴露不出来：
 * 玩家看到的是"剧情突然跳到别处"，开发者这边什么都没有。现在：
 *   · 控制台打一条带位置和堆栈的 [崩溃] 日志（本地调试 / 远程排查都能查）
 *   · 内存里留最近 20 条（不进存档、不撑大 localStorage），档案面板可见——
 *     手机上没有控制台，玩家也能截图反馈
 *   · 同一条错误反复出现只累加次数、不刷屏；玩家侧提示 30 秒最多一次
 */
const CRASH_LOG=[];
const CRASH_MAX=20;
let _crashToastAt=0;
function crashNote(src,msg,detail){
  const now=Date.now();
  const rec={t:now,src:String(src||'异常'),msg:String(msg==null?'未知错误':msg).slice(0,300),detail:detail?String(detail).slice(0,800):''};
  const last=CRASH_LOG[CRASH_LOG.length-1];
  if(last&&last.src===rec.src&&last.msg===rec.msg){last.n=(last.n||1)+1;last.t=now;}
  else{CRASH_LOG.push(rec);if(CRASH_LOG.length>CRASH_MAX)CRASH_LOG.shift();}
  try{console.error('[崩溃] '+rec.src+' · '+rec.msg+(rec.detail?('\n'+rec.detail):''));}catch(_){}
  if(now-_crashToastAt>30000){
    _crashToastAt=now;
    try{toast('⚠️ 刚遇到一点异常，已自动回到安全进度（详情见「档案 → 运行日志」）');}catch(_){}
  }
}
function recover(){
  if(recovering||!S)return;
  recovering=true;
  try{UI={mode:'event',ev:safeEvent()};save();renderGame();}
  catch(e){crashNote('恢复流程自身出错',(e&&e.message)||e,(e&&e.stack)||'');}
  recovering=false;
}
window.addEventListener('error',function(e){
  /* 图片、脚本等资源加载失败也会冒泡到 window，它们没有 message，
   * 不该被当成代码崩溃记一笔（否则网络抖动就刷满日志）。 */
  if(e&&e.target&&e.target!==window&&e.target.tagName)return;
  const at=((e&&e.filename)||'')+((e&&e.lineno)?(':'+e.lineno+':'+((e&&e.colno)||0)):'');
  crashNote('脚本异常',(e&&e.message)||e,(at+(e&&e.error&&e.error.stack?('\n'+e.error.stack):'')));
  recover();
});
window.addEventListener('unhandledrejection',function(e){
  /* AI 点评 / 实时事件流全程是 Promise，被拒绝时会静默消失，这里必须收住 */
  const r=e&&e.reason;
  crashNote('未处理的 Promise',(r&&r.message)||r,(r&&r.stack)||'');
});

/* ═══════════ 11.5 键盘操作 ═══════════
 * 桌面玩家第一反应是敲键盘，不是找鼠标。这里把常用动作接到按键上：
 *   1-9          直接选择对应编号的剧情选项
 *   ↑ / ↓        在选项间移动高亮（高亮态与 :hover 同款，看得见）
 *   Enter / 空格  确认当前高亮的选项
 *   空格 / Enter  没有选项时触发「继续 ▶」这类主按钮（结算 / 赛季总结 / 下一年）
 *   Esc          关掉弹出的面板 / 取消当前高亮
 * 生效范围只有游戏主区 #stage：建档页、AI 设置面板这些有输入框的地方完全放行，
 * 弹窗打开时也不抢键，避免误触。
 */
function kbHint(){
  const st=document.getElementById('stage');
  if(!st||st.querySelector('.ch')||st.querySelector('.kbhint'))return;
  const bs=st.querySelectorAll('button.btn');
  let btn=null;
  for(let i=0;i<bs.length;i++){if(!bs[i].classList.contains('ghost')&&!bs[i].disabled){btn=bs[i];break;}}
  if(!btn)return;
  const d=document.createElement('div');
  d.className='kbhint mini';
  d.style.cssText='text-align:center;margin:10px 0 -6px';
  d.textContent='⌨️ 空格 / Enter 也可以继续';
  btn.parentNode.insertBefore(d,btn);
}
(function(){
  const SEL='kbsel';
  function typing(el){
    if(!el)return false;
    const t=(el.tagName||'').toUpperCase();
    return t==='INPUT'||t==='TEXTAREA'||t==='SELECT'||el.isContentEditable===true;
  }
  function ovlOpen(){const o=document.getElementById('ovl');return !!(o&&o.classList.contains('on'));}
  function stageEl(){return document.getElementById('stage');}
  function optList(){
    const st=stageEl();if(!st)return [];
    const box=st.querySelector('#chs');
    if(!box||box.dataset.locked)return [];
    return [].slice.call(box.querySelectorAll('.ch'));
  }
  function primaryBtn(){
    const st=stageEl();if(!st)return null;
    const bs=st.querySelectorAll('button.btn');
    for(let i=0;i<bs.length;i++){
      const b=bs[i];
      if(!b.classList.contains('ghost')&&!b.disabled)return b;
    }
    return null;
  }
  function hiOf(list){let k=-1;list.forEach((b,i)=>{if(b.classList.contains(SEL))k=i;});return k;}
  function paint(list,k){list.forEach((b,i)=>{b.classList.toggle(SEL,i===k);});}

  document.addEventListener('keydown',function(e){
    if(e.ctrlKey||e.metaKey||e.altKey)return;
    if(typing(e.target))return;

    if(ovlOpen()){
      if(e.key==='Escape'){e.preventDefault();try{closeOvl();}catch(_){}}
      return;
    }

    const k=e.key,list=optList();

    if(list.length){
      /* 数字键：直接选，不再要求先高亮 */
      if(k.length===1&&k>='1'&&k<='9'){
        const i0=k.charCodeAt(0)-49;
        if(i0<list.length){e.preventDefault();list[i0].click();}
        return;
      }
      if(k==='Escape'){paint(list,-1);return;}
      if(k==='ArrowDown'||k==='ArrowUp'){
        e.preventDefault();
        const cur=hiOf(list);
        const nx=k==='ArrowDown'?Math.min(list.length-1,cur+1):Math.max(0,cur<=0?0:cur-1);
        paint(list,nx);
        try{list[nx].scrollIntoView({block:'nearest'});}catch(_){}
        return;
      }
      if(k==='Enter'||k===' '||k==='Spacebar'){
        const cur=hiOf(list);
        /* 没有任何高亮就不动 —— 选项是要负责的，别让空格随手替玩家拍板 */
        if(cur<0)return;
        e.preventDefault();
        list[cur].click();
      }
      return;
    }

    if(k===' '||k==='Spacebar'||k==='Enter'){
      const b=primaryBtn();
      if(b){e.preventDefault();b.click();}
    }
  });
})();

renderMenu();

/* ═══════════ 11.6 场景插画预热 ═══════════
 * 事件插图是按「本页氛围」现挑的（artMood → ART_IMG），所以只有翻开那一页才开始下载，
 * 每次都要干等一个来回。这里在空闲时按低优先级把 19 张拉进浏览器缓存，
 * 之后翻页基本就是秒出。省流模式 / 2G / 3G 下直接跳过，不替玩家花流量。
 */
/* PWA（v4.15）：service worker 注册——仅在 http/https 下注册（file:// 直接打开不注册不报错） */
if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol)){
  window.addEventListener('load',function(){navigator.serviceWorker.register('./sw.js').catch(function(){});});
}
function warmArtImages(){
  try{
    var c=navigator.connection||navigator.mozConnection||navigator.webkitConnection;
    if(c&&(c.saveData||/(^|-)2g$|(^|-)3g$/.test(String(c.effectiveType||''))))return;
    var keys=Object.keys(ART_IMG),i=0,seen={};
    (function next(){
      var url=null;
      while(i<keys.length){                       /* ART_IMG.court 是 arena 的别名，去重 */
        var u=ART_IMG[keys[i++]];
        if(u&&!seen[u]){seen[u]=1;url=u;break;}
      }
      if(!url)return;
      var im=new Image();
      try{im.fetchPriority='low';}catch(_){}
      im.onload=im.onerror=function(){setTimeout(next,220);};  /* 串行 + 间隔，别挤占交互请求 */
      im.src=url;
    })();
  }catch(_){}
}
setTimeout(function(){
  if(window.requestIdleCallback)requestIdleCallback(warmArtImages,{timeout:4000});
  else warmArtImages();
},2500);
</script>
